            - quota_schedule_conflict
            - quota_schedule_storage
            - quota_schedule_unavailable
            - quota_confirmation_expired
            - quota_operation_unavailable
            - internal_error
            - history_timeout
            - subscription_settings_invalid
            - subscription_settings_conflict
            - branding_invalid_title
            - branding_invalid_mode
            - branding_invalid_path
            - branding_logo_unreadable
            - branding_invalid_image
            - not_found
            - telemt_unreachable
            - capability_absent
            - capability_unavailable
            - manual_restart_required
            - manual_service_control_required
            - service_action_unconfirmed
            - update_locked
            - update_version_unsupported
            - sublink_unavailable
            - log_tail_unavailable
            - log_stream_unavailable
            - log_source_error
            - invalid_webauthn_origin
            - invalid_webauthn_challenge
            - invalid_webauthn_response
            - webauthn_credential_exists
            - passkey_unavailable
            - telemt_auth_failed
            - user_exists
            - last_user_forbidden
            - read_only
            - revision_conflict
            - invalid_toml
            - invalid_config_path
            - config_unset_unsupported
            - no_changes
            - toml_projection_failed
            - reload_in_progress
            - reload_not_found
            - ambiguous_listeners
            - access_not_editable
            - section_not_editable
            - field_not_editable
            - unauthorized
            - forbidden
            - method_not_allowed
            - config_patch_not_atomic
            - payload_too_large
            - api_disabled
            - maestro_unavailable
            - unsupported_media_type
            - web_runtime_unavailable
            - web_snapshot_busy
            - web_runtime_mismatch
            - web_issuance_enabled
            - web_operation_in_progress
            - web_session_not_found
            - web_operation_not_found
            - web_vhost_not_found
            - web_profile_required
          description: >
            Machine code. Panel codes actually emitted today (grepped from every
            WriteError call site): bad_request, invalid_credentials, rate_limited,
            session_expired, session_revoke_failed, csrf_rejected, auth_disabled, internal_error, not_found,
            telemt_response_too_large, history_timeout,
            telemt_unreachable, capability_absent, capability_unavailable,
            manual_restart_required, update_locked, sublink_unavailable,
            log_tail_unavailable, log_stream_unavailable, log_source_error,
            invalid_webauthn_origin,
            invalid_webauthn_challenge, invalid_webauthn_response,
            webauthn_credential_exists, passkey_unavailable,
            quota_reset_busy, quota_confirmation_expired, quota_operation_unavailable,
            invalid_toml, invalid_config_path, config_unset_unsupported,
            no_changes, toml_projection_failed.
            capability_absent (501) vs capability_unavailable (503) are
            deliberately distinct, not aliases: capability_absent means the
            route itself doesn't exist on this Telemt build (a bare 404/405
            with no error envelope — detected reactively, after attempting
            the call: rotate-secret, enable/disable, POST /api/telemt/reload,
            GET /api/telemt/reload/{id}); capability_unavailable means the
            route exists but the feature behind it is switched off on this
            Telemt — either known up front from the SDK's cached Capabilities
            probe (GET/PATCH /api/telemt/config, config_api) or reported by
            the response itself (GET /api/telemt/tls-fingerprints, whose
            enabled:false means runtime_edge_enabled is off; read from the
            response rather than probed so an unreachable Telemt still maps
            to 502 telemt_unreachable).
            Reserved for milestones not yet implemented: telemt_auth_failed
            (superseded on /api/telemt/info by a reachable:false
            body, not an error status — kept here for /api/telemt/config, M3).
            A well-formed Telemt *APIError whose status is 4xx and isn't otherwise
            mapped above is passed through verbatim with Telemt's own code — notably
            user_exists, last_user_forbidden, read_only, revision_conflict,
            reload_in_progress, reload_not_found, ambiguous_listeners (the latter two
            absent from Telemt's own documented error-code table but confirmed against
            its source, M3), plus any other code in Telemt's own set (07-telemt-sdk.md):
            bad_request, access_not_editable, section_not_editable, field_not_editable,
            unauthorized, forbidden, method_not_allowed, config_patch_not_atomic,
            payload_too_large, api_disabled, maestro_unavailable — except
            access_not_editable/section_not_editable/field_not_editable/
            config_patch_not_atomic/ambiguous_listeners on PATCH /api/telemt/config,
            which the panel remaps to HTTP 422 regardless of Telemt's own status.
            The WEB group (Telemt >= 3.5.3, internal/telemt/types_web.go) adds
            web_runtime_mismatch, web_issuance_enabled, web_operation_in_progress,
            web_snapshot_busy, web_session_not_found, web_operation_not_found and
            unsupported_media_type; web_runtime_unavailable is listed because it is
            Telemt's own code, but the panel remaps it to capability_unavailable
            (rule R5) so the closed-capability gate is drawn instead of an error.
            Every code in this enum must carry a message in BOTH dictionaries —
            web/src/i18n/i18n.test.ts walks this list.
        message: { type: string }

    User:
      type: object
      description: Telemt UserInfo merged with quota usage and panel extras.
      required: [username, enabled, current_connections, active_unique_ips, total_octets, links]
      properties:
        username: { type: string }
        enabled: { type: boolean }
        cluster_managed: { type: boolean, description: Native links use the applied cluster ingress. }
        in_runtime: { type: boolean }
        user_ad_tag: { type: string }
        max_tcp_conns: { type: integer }
        max_unique_ips: { type: integer }
        data_quota_bytes: { type: integer, format: int64 }
        expiration_rfc3339: { type: string, format: date-time }
        rate_limit_up_bps: { type: integer, format: int64 }
        rate_limit_down_bps: { type: integer, format: int64 }
        current_connections: { type: integer, format: int64 }
        active_unique_ips: { type: integer }
        active_unique_ips_list: { type: array, items: { type: string } }
        recent_unique_ips: { type: integer }
        recent_unique_ips_list: { type: array, items: { type: string } }
        total_octets: { type: integer, format: int64, deprecated: true, description: Raw Telemt process counter retained for compatibility. }
        links: { $ref: "#/components/schemas/UserLinks" }
        quota:
          type: object
          description: Present when the quota capability is available and the user has a quota.
          required: [used_bytes, last_reset_epoch_secs]
          properties:
            used_bytes: { type: integer, format: int64 }
            last_reset_epoch_secs: { type: integer, format: int64 }
        traffic: { $ref: "#/components/schemas/UserTraffic" }
        ip_history: { $ref: "#/components/schemas/UserIPSummary" }
        sub_url: { type: string, description: Absolute subscription page URL }

    UserTraffic:
      type: object
      required: [observed_total_bytes, current_month_bytes, month_key, observed_since_epoch_secs, last_activity_epoch_secs, continuity]
      properties:
        observed_total_bytes: { type: integer, format: int64, minimum: 0 }
        current_month_bytes: { type: integer, format: int64, minimum: 0 }
        month_key: { type: integer, description: UTC month in YYYYMM form }
        observed_since_epoch_secs: { type: integer, format: int64 }
        last_activity_epoch_secs: { type: integer, format: int64 }
        continuity: { $ref: "#/components/schemas/TrafficContinuity" }

    UserLinks:
      type: object
      required: [classic, secure, tls, tls_domains]
      properties:
        classic: { type: array, items: { type: string } }
        secure: { type: array, items: { type: string } }
        tls: { type: array, items: { type: string } }
        tls_domains:
          type: array
          items:
            type: object
            required: [domain, link]
            properties:
              domain: { type: string }
              link: { type: string }

    UserCreate:
      type: object
      required: [username]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$" }
        secret: { type: string, pattern: "^[0-9a-fA-F]{32}$" }
        user_ad_tag: { type: string, pattern: "^[0-9a-fA-F]{32}$" }
        max_tcp_conns: { type: integer, minimum: 1 }
        max_unique_ips: { type: integer, minimum: 1 }
        data_quota_bytes: { type: integer, format: int64, minimum: 1 }
        expiration_rfc3339: { type: string, format: date-time }
        rate_limit_up_bps: { type: integer, format: int64, minimum: 0, description: "Bits per second; 0 is unlimited. Telemt 3.5.8+ accepts at most 100000000000." }
        rate_limit_down_bps: { type: integer, format: int64, minimum: 0, description: "Bits per second; 0 is unlimited. Telemt 3.5.8+ accepts at most 100000000000." }
        enabled: { type: boolean, default: true }

    UserPatch:
      type: object
      description: JSON Merge Patch — null removes a limit, omitted leaves unchanged.
      properties:
        secret: { type: string, pattern: "^[0-9a-fA-F]{32}$" }
        user_ad_tag: { type: [string, "null"] }
        max_tcp_conns: { type: [integer, "null"] }
        max_unique_ips: { type: [integer, "null"] }
        data_quota_bytes: { type: [integer, "null"], format: int64 }
        expiration_rfc3339: { type: [string, "null"] }
        rate_limit_up_bps: { type: [integer, "null"], format: int64, minimum: 0, description: "Bits per second; 0/null removes the rate limit. Telemt 3.5.8+ accepts at most 100000000000." }
        rate_limit_down_bps: { type: [integer, "null"], format: int64, minimum: 0, description: "Bits per second; 0/null removes the rate limit. Telemt 3.5.8+ accepts at most 100000000000." }
        enabled: { type: [boolean, "null"] }

    Sublink:
      type: object
      required: [url, enabled]
      properties:
        url: { type: string }
        enabled: { type: boolean, description: false when subpage module is disabled }

    TelemtInfo:
      type: object
      required: [reachable, capabilities]
      properties:
        reachable: { type: boolean }
        version: { type: string }
        arch: { type: string }
        os: { type: string }
        uptime_seconds: { type: number }
        config_path: { type: string }
        config_edit_mode:
          type: string
          enum: [api, file]
          description: Deprecated compatibility value from 0.x; editing always requires the Telemt Config API.
        capabilities:
          type: object
          description: Detected per 07-telemt-sdk.md §SDK-3.
          required: [quota, runtime_edge, reload_api, config_api, user_enable_disable, rotate_secret]
          properties:
            quota: { type: boolean }
            runtime_edge: { type: boolean }
            reload_api: { type: boolean }
            config_api: { type: boolean }
            user_enable_disable: { type: boolean }
            rotate_secret: { type: boolean }
        hint:
          type: string
          description: Actionable diagnostic (e.g. "check [server.api].whitelist — connection dropped").

    ZeroAllData:
      type: object
      description: >
        GET /v1/stats/zero/all's deep counter dump, passed through as-is. Only the top
        level (five named sections) is typed — each section's leaves are a display-only
        object mixing u64 counters with bools/strings/nested arrays (07-telemt-sdk.md),
        never branched on by the panel.
      required: [generated_at_epoch_secs, core, upstream, middle_proxy, pool, desync]
      properties:
        generated_at_epoch_secs: { type: integer }
        core: { type: object, additionalProperties: true }
        upstream: { type: object, additionalProperties: true }
        middle_proxy: { type: object, additionalProperties: true }
        pool: { type: object, additionalProperties: true }
        desync: { type: object, additionalProperties: true }

    TlsFingerprintRow:
      type: object
      description: >
        One aggregated JA3/JA4 row. `scope` is present only in the by_ip/by_cidr/by_user
        lists (the grouping key), absent in by_fingerprint — TELEMT_LIVE_API_DATA.md §19.
      required: [ja3, ja3_raw, ja4, ja4_raw, total, auth_success, bad_or_probe, first_seen_epoch_secs, last_seen_epoch_secs]
      properties:
        scope: { type: string }
        ja3: { type: string }
        ja3_raw: { type: string }
        ja4: { type: string }
        ja4_raw: { type: string }
        total: { type: integer }
        auth_success: { type: integer }
        bad_or_probe: { type: integer }
        first_seen_epoch_secs: { type: integer }
        last_seen_epoch_secs: { type: integer }

    TlsFingerprints:
      type: object
      required: [limit, retention_secs, capacity, dropped_total, parse_error_total, by_fingerprint, by_ip, by_cidr, by_user]
      properties:
        limit: { type: integer }
        retention_secs: { type: integer }
        capacity: { type: integer }
        dropped_total: { type: integer }
        parse_error_total: { type: integer }
        by_fingerprint: { type: array, items: { $ref: "#/components/schemas/TlsFingerprintRow" } }
        by_ip: { type: array, items: { $ref: "#/components/schemas/TlsFingerprintRow" } }
        by_cidr: { type: array, items: { $ref: "#/components/schemas/TlsFingerprintRow" } }
        by_user: { type: array, items: { $ref: "#/components/schemas/TlsFingerprintRow" } }

    GatedTlsFingerprints:
      type: object
      description: >
        Telemt's Gated[T] wrapper, passed through as-is: `data` is omitted when the
        source is off or unavailable, and `reason` says why (07-telemt-sdk.md).
      required: [enabled, generated_at_epoch_secs]
      properties:
        enabled: { type: boolean }
        reason: { type: string }
        generated_at_epoch_secs: { type: integer }
        data: { $ref: "#/components/schemas/TlsFingerprints" }

    WebAccessProfile:
      type: object
      required: [user, secret_mode]
      properties:
        user: { type: string }
        secret_mode: { type: string, enum: [plain, dd] }
        max_sessions: { type: integer, format: uint64, minimum: 1 }
        max_streams: { type: integer, format: uint64, minimum: 1 }
        max_streams_per_session: { type: integer, format: uint64, minimum: 1 }

    WebAccessVhost:
      type: object
      required: [host, public_addr, profiles]
      properties:
        host: { type: string }
        base_path: { type: string, maxLength: 128, description: "Telemt WEB prefix without surrounding slashes; case-sensitive, available since 3.5.8." }
        public_addr: { type: string }
        profiles: { type: array, items: { $ref: "#/components/schemas/WebAccessProfile" } }

    WebAccessView:
      type: object
      required: [revision, enabled, vhosts]
      properties:
        revision: { type: string }
        enabled: { type: boolean }
        vhosts: { type: array, items: { $ref: "#/components/schemas/WebAccessVhost" } }

    WebUserAccessProfile:
      type: object
      required: [vhost, secret_mode]
      properties:
        vhost: { type: string }
        secret_mode: { type: string, enum: [plain, dd] }
        max_sessions: { type: integer, format: uint64, minimum: 1 }
        max_streams: { type: integer, format: uint64, minimum: 1 }
        max_streams_per_session: { type: integer, format: uint64, minimum: 1 }

    WebUserAccessUpdate:
      type: object
      required: [profiles]
      properties:
        profiles: { type: array, items: { $ref: "#/components/schemas/WebUserAccessProfile" } }

    WebSessionRow:
      type: object
      description: >
        One live WEB session. `session_ref` plus the optional user-agent pair sit at the
        same level as the WebSessionStatus fields — Telemt flattens the status struct
        into the row (`#[serde(flatten)]`, src/web/session/status.rs). The health
        publication and peer inactivity observations are optional for builds before 3.5.6.
      required: [session_ref, trace_session_id, client_ip, host, user, key_id, carrier, attempt, client_class, automatic, state, streams, tasks, lanes, lane_open_waits, websocket_lane_reservations, websocket_active, pending_bytes, pending_items, control_bytes, control_items, age_ms, idle_ms]
      properties:
        session_ref: { type: string }
        user_agent: { type: string }
        user_agent_id: { type: string }
        trace_session_id: { type: integer }
        client_ip: { type: string }
        host: { type: string }
        user: { type: string }
        key_id: { type: string }
        carrier: { type: string, enum: [https, https-lanes, websocket, websocket-lanes] }
        attempt: { type: integer }
        client_class: { type: string }
        automatic: { type: boolean }
        state: { type: string }
        health_publication:
          type: string
          description: Manager-confirmed health publication phase; tokens remain open to future values.
        streams: { type: integer }
        tasks: { type: integer }
        lanes: { type: integer }
        lane_open_waits: { type: integer }
        websocket_lane_reservations: { type: integer }
        websocket_active: { type: boolean }
        pending_bytes: { type: integer }
        pending_items: { type: integer }
        control_bytes: { type: integer }
        control_items: { type: integer }
        age_ms: { type: integer }
        idle_ms:
          type: integer
          description: Time since the latest peer or carrier progress.
        peer_idle_ms:
          type: integer
          description: Time since the latest validated peer operation.
        reconnect_grace_ms:
          type: integer
          description: Session-frozen authenticated peer inactivity allowance.
        peer_deadline_remaining_ms:
          type: integer
          description: Remaining time before peer inactivity makes the session eligible for cleanup.
        negotiation_remaining_ms: { type: integer }

    WebSessionPage:
      type: object
      description: >
        One page of the ordered scan. There is no total: the scan is bounded (Telemt caps it
        at 1000 candidates, reporting `scan_truncated`) and paging is by opaque cursor.
        `partial` is `["manager"]` when the manager lock was contended — an empty page that
        means "busy", not "no sessions".
      required: [sessions, next_cursor, scanned, scan_truncated, partial_sessions, partial]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/WebSessionRow" } }
        next_cursor: { type: [string, "null"] }
        scanned: { type: integer }
        scan_truncated: { type: boolean }
        partial_sessions: { type: integer }
        partial: { type: array, items: { type: string } }

    WebSessionClosed:
      type: object
      description: >
        The retained tombstone of a session that has already closed. Carrier, reason,
        and closure age are optional for builds before Telemt 3.5.6.
      required: [session_ref, state, attempt]
      properties:
        session_ref: { type: string }
        state: { type: string }
        attempt: { type: integer }
        carrier: { type: string }
        reason: { type: string }
        closed_age_ms: { type: integer }

    WebSessionLookup:
      type: object
      description: >
        Exactly one of the two is present: `row` for a live session, `closed` for a
        tombstone.
      properties:
        row: { $ref: "#/components/schemas/WebSessionRow" }
        closed: { $ref: "#/components/schemas/WebSessionClosed" }

    WebCloseSelector:
      type: object
      description: >
        Internally tagged by `kind`. `refs` carries 1..200 canonical refs; `filter` needs at
        least one of the filter fields; `all` is the whole registry and is refused while WEB
        issuance is still enabled.
      required: [kind]
      properties:
        kind: { type: string, enum: [refs, filter, all] }
        session_refs: { type: array, items: { type: string } }
        session_ref: { type: string }
        ip: { type: string }
        host: { type: string }
        user: { type: string }
        user_agent_id: { type: string }
        key_id: { type: string }
        carrier: { type: string, enum: [https, https-lanes, websocket, websocket-lanes] }
        state: { type: string }

    WebCloseRequest:
      type: object
      required: [runtime_instance, selector]
      properties:
        runtime_instance:
          type: string
          description: >
            The process fence, read from the `web` topic's status snapshot. A Telemt that
            has restarted since answers 409 web_runtime_mismatch instead of closing whatever
            now holds those ids.
        selector: { $ref: "#/components/schemas/WebCloseSelector" }

    WebControlOperationStatus:
      type: object
      description: >
        The 202 body of a close and the 200 body of its poll — the same shape. `requested`
        is the explicit ref count for a `refs` selector and 0 for `filter`/`all`, which have
        no up-front size.
      required: [operation_id, state, high_water_session_ref, requested, scanned, matched, close_signalled, conflicted, created_epoch_millis, updated_epoch_millis]
      properties:
        operation_id: { type: string }
        state: { type: string, enum: [queued, running, completed, cancelled, failed] }
        high_water_session_ref: { type: [string, "null"] }
        requested: { type: integer }
        scanned: { type: integer }
        matched: { type: integer }
        close_signalled: { type: integer }
        conflicted: { type: integer }
        created_epoch_millis: { type: integer, format: int64 }
        updated_epoch_millis: { type: integer, format: int64 }
        failure: { type: string }

    TelemtConfig:
      type: object
      description: >
        Editable configuration obtained through the Telemt Config API.
        Direct file editing is not supported, regardless of telemt.config_edit_mode.
      required: [revision, sections]
      properties:
        revision: { type: string }
        sections:
          type: object
          additionalProperties: {}
          description: >
            Map of section name → that section's JSON, including arrays such as upstreams, straight from Telemt (integers
            preserved). Open-ended: a section a newer Telemt adds (`web`, since 3.5.3)
            passes through unchanged rather than being dropped, and a section value the
            panel received as null is passed on as null rather than synthesized into {}.

    TelemtConfigPatch:
      type: object
      description: >
        The revision travels as the request's `If-Match` header (required), not a body
        field here — see PATCH /api/telemt/config's description.
      required: [sections]
      properties:
        sections:
          type: object
          additionalProperties: true
          description: Sparse map of section name → JSON Merge Patch value for that section.

    TelemtConfigTOML:
      type: object
      required: [revision, toml_projection, source_sections, projection_kind]
      properties:
        revision: { type: string }
        toml_projection: { type: string }
        source_sections: { type: array, items: { type: string } }
        projection_kind:
          type: string
          enum: [normalized_config_api]
          description: Stable code describing the projection's limitations; localized by the client.

    TelemtConfigCatalog:
      type: object
      required: [version, source_commit, documented_fields, runtime_additions, groups, fields]
      properties:
        version: { type: string }
        source_commit: { type: string }
        documented_fields: { type: integer }
        runtime_additions: { type: array, items: { type: string } }
        groups: { type: array, items: { $ref: "#/components/schemas/TelemtConfigGroup" } }
        fields: { type: array, items: { $ref: "#/components/schemas/TelemtConfigField" } }

    TelemtConfigGroup:
      type: object
      required: [id, title, short]
      properties:
        id: { type: string }
        title: { type: string }
        short: { type: string }

    TelemtConfigField:
      type: object
      required: [path, data_type, kind, default_value, doc_hot, apply, tier, group, secret]
      properties:
        path: { type: string }
        data_type: { type: string }
        kind: { type: string, enum: [boolean, integer, decimal, string, enum, string_list, integer_list, map, structure] }
        options: { type: array, items: { type: string } }
        default_value: { type: string }
        doc_hot: { type: boolean }
        apply: { type: string }
        tier: { type: string, enum: [normal, advanced] }
        group: { type: string }
        secret: { type: boolean }
        runtime_addition: { type: boolean }

    TelemtConfigTOMLRequest:
      type: object
      required: [toml_projection]
      properties:
        toml_projection: { type: string }

    TelemtConfigTOMLPreview:
      type: object
      required: [revision, patch, patch_json, changed_paths, materialized_sections, array_replacements]
      properties:
        revision: { type: string }
        patch:
          type: object
          additionalProperties: true
        patch_json:
          type: string
          description: Exact JSON text of the sparse patch, preserving integer literals for preview.
        changed_paths: { type: array, items: { type: string } }
        materialized_sections: { type: array, items: { type: string } }
        array_replacements: { type: array, items: { type: string } }

    TelemtConfigPatchResult:
      type: object
      description: Telemt's PATCH /v1/config response, passed through as-is.
      required: [revision, changed]
      properties:
        revision: { type: string }
        changed: { type: array, items: { type: string } }
        restart_required: { type: boolean, description: Legacy field, still sent by current Telemt builds. }
        runtime_reload_required: { type: boolean }
        process_restart_required: { type: boolean }
        deferred_process_fields: { type: array, items: { type: string } }
        reload:
          description: Present only when the request's `reload` query parameter triggered an inline reload.
          allOf: [{ $ref: "#/components/schemas/ReloadAccepted" }]

    ReloadAccepted:
      type: object
      description: The 202 payload of Telemt's POST /v1/system/reload, passed through as-is.
      required: [reload_id, target_generation, config_revision, state, mode, failure_policy]
      properties:
        reload_id: { type: integer, format: int64 }
        target_generation: { type: integer, format: int64 }
        config_revision: { type: string }
        state: { type: string, enum: [accepted, preparing, activating, draining, succeeded, rolled_back, failed] }
        mode: { type: string, enum: [instant, drain] }
        failure_policy: { type: string, enum: [keep_new, rollback] }

    ReloadStatus:
      type: object
      description: Telemt's GET /v1/system/reload/{id} response, passed through as-is.
      required: [reload_id, target_generation, config_revision, state, mode, failure_policy, requested_at_epoch_secs]
      properties:
        reload_id: { type: integer, format: int64 }
        target_generation: { type: integer, format: int64 }
        config_revision: { type: string }
        state: { type: string, enum: [accepted, preparing, activating, draining, succeeded, rolled_back, failed] }
        mode: { type: string, enum: [instant, drain] }
        failure_policy: { type: string, enum: [keep_new, rollback] }
        requested_at_epoch_secs: { type: integer, format: int64 }
        started_at_epoch_secs: { type: integer, format: int64 }
        finished_at_epoch_secs: { type: integer, format: int64 }
        deferred_process_fields: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        error: { type: string }

    HostInfo:
      type: object
      required: [service_manager, log_source, privileges_mode, os, arch, panel_variant, storage_drivers, active_store, history_temporary, caps]
      properties:
        service_manager: { type: string, enum: [systemd, openrc, procd, sysvinit, docker, custom, none] }
        log_source: { type: string, enum: [journald, logread, syslog, docker, file, none] }
        privileges_mode: { type: string, enum: [sudo, direct, manual] }
        os: { type: string, description: Go runtime operating system identifier, example: linux }
        arch: { type: string, description: Go runtime architecture identifier, example: amd64 }
        os_release: { type: string }
        panel_variant: { type: string, enum: [full, lite] }
        storage_drivers:
          type: array
          items: { type: string, enum: [memory, sqlite] }
        active_store: { type: string, enum: [memory, sqlite] }
        history_temporary:
          type: boolean
          description: SQLite could not be opened at daemon startup; history is temporarily in memory until restart. False for intentionally configured memory storage. Panel state persistence is independent.
        caps:
          type: object
          required: [restart_telemt, restart_panel, log_tail, log_stream, self_update]
          properties:
            restart_telemt: { type: boolean }
            restart_panel: { type: boolean }
            log_tail: { type: boolean }
            log_stream: { type: boolean }
            self_update: { type: boolean }
            config_file: { type: boolean, description: Agent full-file tool configured; each operation verifies protocol capability. }
            start_telemt: { type: boolean, description: Independently permitted start of the configured Telemt service. }
            stop_telemt: { type: boolean, description: Independently permitted stop of the configured Telemt service. }
        manual_commands:
          type: object
          additionalProperties: { type: string }
          description: Copyable shell commands or actionable manual instructions for operations with cap=false.

    TelemtServiceState:
      type: object
      required: [service, manager, status, status_supported, binding_conflict, caps, manual_commands, busy]
      properties:
        service: { type: string }
        manager: { type: string }
        status: { type: string, enum: [running, stopped, unknown] }
        status_supported: { type: boolean }
        status_error: { type: string, enum: [service_status_unavailable] }
        binding_conflict: { type: boolean, description: The configured start/stop target collides with the panel binding. }
        busy: { type: boolean, description: Shared host lock is held by a service command or an update. }
        caps:
          type: object
          required: [start, stop, restart]
          properties:
            start: { type: boolean }
            stop: { type: boolean }
            restart: { type: boolean }
        manual_commands: { type: object, additionalProperties: { type: string } }
    UpdatesStatus:
      type: object
      required: [targets, lock_held]
      properties:
        lock_held: { type: boolean }
        targets:
          type: array
          items:
            type: object
            required: [target, current_version, releases]
            properties:
              target: { type: string, enum: [telemt, panel] }
              current_version: { type: string }
              releases_error:
                type: string
                enum: [update_catalog_unavailable]
                description: Release lookup failed. An empty releases array with this field is not evidence that the installed version is current.
              releases:
                type: array
                items:
                  type: object
                  required: [version, published_at]
                  properties:
                    version: { type: string }
                    published_at: { type: string, format: date-time }
                    prerelease: { type: boolean }
                    newer: { type: boolean }
                    checksum_required: { type: boolean, deprecated: true, description: Always false. Runtime updates do not require checksum assets. }
                    checksum_available: { type: boolean, description: A checksum asset is present; this does not claim that its contents have already been verified. }
              active_run: { $ref: "#/components/schemas/UpdateRun" }
              journal: { type: array, items: { $ref: "#/components/schemas/UpdateRun" } }

    UpdateRun:
      type: object
      required: [run_id, target, phase, version_to, started_at]
      properties:
        run_id: { type: string }
        target: { type: string, enum: [telemt, panel] }
        phase:
          type: string
          enum: [checking, downloading, verifying, staging, installing, restarting, health, done, rolling_back, rolled_back, failed]
        version_from: { type: string }
        version_to: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        detail: { type: string }

    AutoUpdateSettings:
      type: object
      required: [telemt, panel, interval]
      properties:
        telemt: { type: string, enum: [off, check, apply] }
        panel: { type: string, enum: [off, check, apply] }
        interval: { type: string, description: Go duration ≥ 1h, e.g. "6h" }

    SessionInfo:
      type: object
      required: [id, created, last_seen, current]
      properties:
        id: { type: string }
        created: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        ip: { type: string }
        user_agent_label: { type: string, description: Parsed, human-readable ("iPhone · Safari") }
        auth_method: { type: string, enum: [password, passkey] }
        current: { type: boolean }

    SessionPage:
      type: object
      required: [items, total, device_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionInfo" }
        total: { type: integer, minimum: 0 }
        device_count: { type: integer, minimum: 0, description: Distinct User-Agent and IP pairs in the filtered result }
        next_cursor: { type: string, description: Opaque cursor for the next page; absent on the last page }

    PasskeyInfo:
      type: object
      required: [id, name, created]
      properties:
        id: { type: string }
        name: { type: string }
        created: { type: string, format: date-time }
        last_used: { type: string, format: date-time }

    WebAuthnRegisterBeginRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }

    WebAuthnBeginResponse:
      type: object
      required: [flow_id, public_key]
      properties:
        flow_id: { type: string }
        public_key: { type: object, additionalProperties: true }

    WebAuthnFinishRequest:
      type: object
      required: [flow_id, credential]
      properties:
        flow_id: { type: string }
        credential: { type: object, additionalProperties: true }

    LogSourceDiagnostic:
      type: object
      required: [code, message, source, service, reason]
      properties:
        code: { type: string, enum: [log_source_error] }
        message: { type: string, description: "Safe source diagnostic; no arbitrary command stderr or service log payload." }
        source: { type: string, enum: [journald, docker, file, syslog, logread] }
        service: { type: string, enum: [telemt, panel] }
        target: { type: string, description: "Resolved log unit, container, tag or file path; authenticated administration only." }
        reason: { type: string, enum: [file_missing, permission_denied, command_missing, target_missing, daemon_unavailable, source_timeout, read_failed, command_failed] }
        exit_code: { type: integer }

    LogLine:
      type: object
      required: [ts, msg]
      properties:
        ts: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error, unknown] }
        unit: { type: string }
        msg: { type: string }

    AuditEntry:
      type: object
      required: [ts, id, action, outcome]
      properties:
        ts: { type: string, format: date-time }
        id: { type: string, description: Stable identifier of this retained audit entry }
        action: { type: string, description: "login | user.create | user.patch | user.delete | quota.reset | config.patch | update.apply | ..." }
        actor: { type: string, description: Authenticated administrator or attempted login name }
        target: { type: string, description: User, service, config, or panel resource affected by the action }
        outcome: { type: string, enum: [success, accepted, rejected, partial, unknown] }
        ip: { type: string, description: Trusted client address captured by the panel }
        subject: { type: string, description: Username / target / section }
        detail: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
          description: Structured key/value details when the action supplies them

    TrafficRange:
      type: string
      enum: [24h, 7d, 30d, month, 1y]

    TrafficSourceState:
      type: string
      enum: [collecting, paused, unavailable]

    TrafficContinuity:
      type: string
      enum: [normal, partial]

    TrafficCoverage:
      type: object
      required: [as_of_epoch_secs, boundary_partial, covered_from_epoch_secs, covered_to_epoch_secs]
      description: Available bucket boundary resolution; collector continuity is reported separately. Bounds do not guarantee continuous observations inside the interval.
      properties:
        as_of_epoch_secs: { type: integer, format: int64 }
        boundary_partial: { type: boolean }
        covered_from_epoch_secs: { type: [integer, "null"], format: int64 }
        covered_to_epoch_secs: { type: [integer, "null"], format: int64 }

    TrafficCollection:
      type: object
      required: [source_state, continuity, durability, retention_secs]
      properties:
        source_state: { $ref: "#/components/schemas/TrafficSourceState" }
        continuity: { $ref: "#/components/schemas/TrafficContinuity" }
        durability: { type: string, enum: [durable, volatile] }
        retention_secs: { type: integer, format: int64, minimum: 0 }
        observed_since_epoch_secs: { type: integer, format: int64 }
        observed_through_epoch_secs: { type: integer, format: int64 }

    UserTrafficPoint:
      type: object
      required: [ts, v, tier]
      properties:
        ts: { type: integer, format: int64 }
        v: { type: integer, format: int64, minimum: 0 }
        tier: { type: string, enum: [15m, 1h, 1d] }

    UserTrafficRank:
      type: object
      required: [username, bytes, observed_total_bytes, current_month_bytes, continuity]
      properties:
        username: { type: string }
        bytes: { type: integer, format: int64, minimum: 0 }
        observed_total_bytes: { type: integer, format: int64, minimum: 0 }
        current_month_bytes: { type: integer, format: int64, minimum: 0 }
        deleted_epoch_secs: { type: integer, format: int64 }
        continuity: { $ref: "#/components/schemas/TrafficContinuity" }

    UserTrafficHistorySeries:
      type: object
      required: [metric, range, state, requested_from_epoch_secs, retention_secs, source_state, continuity, durability, points, coverage]
      properties:
        metric: { type: string }
        range: { type: string, enum: [24h, 7d, 30d, 1y] }
        state: { type: string, enum: [ready, disabled, empty, partial] }
        requested_from_epoch_secs: { type: integer, format: int64 }
        retention_secs: { type: integer, format: int64, minimum: 0 }
        available_from_epoch_secs: { type: integer, format: int64 }
        source_available: { type: boolean, deprecated: true }
        source_state: { $ref: "#/components/schemas/TrafficSourceState" }
        continuity: { $ref: "#/components/schemas/TrafficContinuity" }
        durability: { type: string, enum: [durable, volatile] }
        observed_since_epoch_secs: { type: integer, format: int64 }
        observed_through_epoch_secs: { type: integer, format: int64 }
        points: { type: array, items: { $ref: "#/components/schemas/UserTrafficPoint" } }
        coverage: { $ref: "#/components/schemas/TrafficCoverage" }

    TrafficSummary:
      type: object
      required: [range, state, requested_from_epoch_secs, total_bytes, points, top_users, collection, coverage]
      properties:
        range: { $ref: "#/components/schemas/TrafficRange" }
        state: { type: string, enum: [ready, disabled, empty, partial] }
        requested_from_epoch_secs: { type: integer, format: int64 }
        total_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Selected bucket total; for month, the separate accumulated current-month counter is returned even when graph coverage is partial.
        previous_total_bytes: { type: integer, format: int64, minimum: 0 }
        previous_coverage: { $ref: "#/components/schemas/TrafficCoverage" }
        points: { type: array, items: { $ref: "#/components/schemas/UserTrafficPoint" } }
        top_users: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/UserTrafficRank" } }
        collection: { $ref: "#/components/schemas/TrafficCollection" }
        coverage: { $ref: "#/components/schemas/TrafficCoverage" }

    TrafficUsersPage:
      type: object
      required: [range, users, collection, coverage]
      properties:
        range: { $ref: "#/components/schemas/TrafficRange" }
        users: { type: array, items: { $ref: "#/components/schemas/UserTrafficRank" } }
        next_cursor: { type: string }
        collection: { $ref: "#/components/schemas/TrafficCollection" }
        coverage: { $ref: "#/components/schemas/TrafficCoverage" }

    HistorySeries:
      type: object
      required: [metric, range, state, requested_from_epoch_secs, retention_secs, points]
      properties:
        metric: { type: string }
        range: { type: string }
        state:
          type: string
          enum: [ready, disabled, empty, partial]
          description: Explicit collection state; source availability is reported independently.
        requested_from_epoch_secs: { type: integer, format: int64 }
        retention_secs:
          type: integer
          format: int64
          description: >
            Maximum available retention for this metric. Disk-disabled and memory
            stores still provide a two-hour live window; point capacity and gaps
            may shorten actual coverage. 0 means no history is available.
        available_from_epoch_secs:
          type: integer
          format: int64
          description: Oldest returned point; absent when the series is empty.
        source_available:
          type: boolean
          description: Current Telemt source state; absent until availability has been observed.
        points:
          type: array
          items:
            type: object
            required: [ts, v]
            properties:
              ts: { type: integer, format: int64, description: epoch seconds }
              v: { type: number }
              tier: { type: string, enum: [1m, 5m, 15m, 1h, 1d], description: Omitted for raw points; new disk history uses 5m and 1h }
              max: { type: number, description: Bucket maximum; present for aggregate points }
              min: { type: number, description: Bucket minimum; absent for legacy aggregates without observed minima }
              samples: { type: integer, format: int64, minimum: 1, description: Number of observed samples in the aggregate }
              first_observed_epoch_secs: { type: integer, format: int64, description: First actual observation; absent for legacy aggregates }
              first_observed_value: { type: number, description: Value at the first actual observation; absent for raw points and legacy aggregates. Allows counter continuity checks across adjacent buckets. }
              last_observed_epoch_secs: { type: integer, format: int64, description: Last actual observation; absent for legacy aggregates }
              observed_delta: { type: number, minimum: 0, description: Counter movement between observed samples only; excludes resets and unobserved gaps. Not an exact total for the nominal bucket. Absent for gauges or unknown continuity. }
              observed_seconds: { type: integer, format: int64, minimum: 0, description: Observed duration excluding gaps and resets; absent when legacy metadata is unknown }
              gaps: { type: integer, format: int64, minimum: 0, description: Detected gaps or counter resets inside the aggregate; absent for legacy aggregates }

    HistoryEvent:
      type: object
      required: [id, ts, category, kind, entity, state, previous_state, severity]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        category: { $ref: "#/components/schemas/StorageCategory" }
        kind: { type: string, example: dc.coverage.changed }
        entity: { type: string, example: "dc:-203" }
        state: { type: string, example: "66" }
        previous_state: { type: string, example: "100" }
        severity: { type: string, enum: [info, warning, critical] }
        attributes:
          type: object
          additionalProperties: { type: string }

    HistoryEvents:
      type: object
      required: [range, state, requested_from_epoch_secs, retention_secs, events]
      properties:
        range: { type: string, enum: [15m, 30m, 1h, 24h, 7d, 30d, 90d] }
        state: { type: string, enum: [ready, disabled, empty, partial] }
        requested_from_epoch_secs: { type: integer, format: int64 }
        retention_secs:
          type: integer
          format: int64
          description: Configured event retention in seconds; 0 means disabled.
        available_from_epoch_secs:
          type: integer
          format: int64
          description: Oldest returned event; absent when the stream is empty.
        source_available:
          type: boolean
          description: Current Telemt source state; absent until availability has been observed.
        events:
          type: array
          items: { $ref: "#/components/schemas/HistoryEvent" }

    UserIPSummary:
      type: object
      required: [unique, from, collected_through, history_limited, collection_gap]
      properties:
        unique: { type: integer, format: int64, minimum: 0 }
        from: { type: integer, format: int64, description: Last 30 days, clipped by effective retention. }
        collected_through: { type: integer, format: int64 }
        history_limited: { type: boolean }
        collection_gap: { type: boolean }

    UserIPHistoryItem:
      type: object
      required: [username, ip, family, first_observed_at, last_observed_at, observations, last_source_mask, active_now, geo]
      properties:
        username: { type: string }
        ip: { type: string, description: Canonical individual address; mapped IPv4 is unmapped. }
        family: { type: integer, enum: [4, 6] }
        first_observed_at: { type: integer, format: int64 }
        last_observed_at: { type: integer, format: int64 }
        observations: { type: integer, format: int64, minimum: 1, description: Periodic observations, not number of connections. }
        last_active_observed_at: { type: integer, format: int64 }
        last_source_mask: { type: integer, enum: [1, 2, 3], description: Active list (1), recent list (2), both (3). }
        active_now: { type: [boolean, "null"], description: Null if the active source is missing, invalid or older than 30 seconds. }
        geo:
          description: Null when no verified GeoIP database set is active.
          anyOf:
            - $ref: "#/components/schemas/GeoIpResult"
            - type: "null"

    UserIPCollection:
      type: object
      required: [observed_since, collected_through, history_limited, collection_gap]
      properties:
        batch_id: { type: string }
        observed_since: { type: integer, format: int64 }
        collected_through: { type: integer, format: int64 }
        history_limited: { type: boolean }
        collection_gap: { type: boolean }

    UserIPSourceStatus:
      type: object
      required: [state, last_success_at, age_secs, recent_window_secs, pending, history_limited, collection_gap]
      properties:
        state: { type: string, enum: [collecting, unavailable] }
        last_success_at: { type: integer, format: int64 }
        age_secs:
          type: [integer, 'null']
          minimum: 0
          description: Age of the last successful observation at response time, measured on the panel server; null before collection or if the server clock moved backwards.
        recent_window_secs: { type: [integer, "null"], format: int64, minimum: 1 }
        pending: { type: boolean }
        history_limited: { type: boolean }
        collection_gap: { type: boolean }

    UserIPHistory:
      type: object
      required: [items, total, matched, new, next_cursor, range, retention_days, max_ips_per_user, durable, collection, source, active_now_count, geoip]
      properties:
        active_now_count: { type: [integer, "null"], minimum: 0, description: All distinct active addresses for this user, independent of history pagination. Null if the active source is unavailable or stale. }
        items: { type: array, items: { $ref: "#/components/schemas/UserIPHistoryItem" } }
        total: { type: integer, format: int64, description: Addresses in the range before family/search filters. }
        matched: { type: integer, format: int64, description: Addresses matching all filters before pagination. }
        new: { type: integer, format: int64, description: Retained addresses first observed in the range, not a daily time series. }
        next_cursor: { type: string, description: Empty when there is no next page. }
        range: { type: string, enum: [24h, 7d, 30d, all] }
        retention_days: { type: integer, minimum: 1 }
        max_ips_per_user:
          type: integer
          minimum: 0
          maximum: 100000
          description: Effective per-user observed IP history cap. Zero disables this per-user cap; overall memory/SQLite history and collection bounds still apply. This does not limit Telemt connections.
        durable: { type: boolean }
        collection: { $ref: "#/components/schemas/UserIPCollection" }
        source: { $ref: "#/components/schemas/UserIPSourceStatus" }
        geoip: { $ref: "#/components/schemas/GeoIpStatus" }

    StorageCategory:
      type: string
      enum: [technical, events, audit, connection_issues, traffic, user_traffic, user_ip_history, diagnostics]

    StoragePolicy:
      type: object
      required: [category, enabled, retention_days]
      properties:
        category: { $ref: "#/components/schemas/StorageCategory" }
        enabled: { type: boolean }
        retention_days: { type: integer, minimum: 1, maximum: 3650 }
        max_ips_per_user:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000
          description: Only for user_ip_history. Zero disables the per-user cap; positive values retain at most this many newest addresses. Omitted/null in a settings update preserves the existing value. Legacy policies default to 256. Overall memory/SQLite history and collection bounds remain in force.

    StorageCategoryStats:
      type: object
      required: [category, records]
      properties:
        category: { $ref: "#/components/schemas/StorageCategory" }
        records: { type: integer, format: int64, minimum: 0 }
        entities: { type: integer, format: int64, minimum: 0, description: Retained user totals for user_traffic. }
        collector: { $ref: "#/components/schemas/TrafficCollectorState" }

    TrafficCollectorState:
      type: object
      required: [last_success_ts, source_started_at, source_state, continuity]
      properties:
        last_success_ts: { type: integer, format: int64 }
        source_started_at: { type: integer, format: int64 }
        source_state: { $ref: "#/components/schemas/TrafficSourceState" }
        continuity: { $ref: "#/components/schemas/TrafficContinuity" }

    StorageStats:
      type: object
      required: [driver, durable, database_bytes, categories]
      properties:
        driver: { type: string, enum: [memory, sqlite] }
        durable: { type: boolean }
        database_bytes: { type: integer, format: int64, minimum: 0 }
        categories:
          type: array
          items: { $ref: "#/components/schemas/StorageCategoryStats" }

    StorageSettings:
      type: object
      required: [policies, stats, state_durable]
      properties:
        policies:
          type: array
          items: { $ref: "#/components/schemas/StoragePolicy" }
        stats: { $ref: "#/components/schemas/StorageStats" }
        state_durable:
          type: boolean
          description: Whether panel-state.json is enabled and control-plane state survives a restart.

    StorageSettingsUpdate:
      type: object
      required: [policies]
      properties:
        confirm_retention_reduction:
          type: boolean
          default: false
          description: Explicitly acknowledges deletion due to shorter retention or a lower per-user IP history cap, including unlimited to finite.
        policies:
          type: array
          items: { $ref: "#/components/schemas/StoragePolicy" }

    StoragePurgeRequest:
      type: object
      required: [category, confirm]
      properties:
        category: { $ref: "#/components/schemas/StorageCategory" }
        confirm: { type: boolean, const: true }

    DestructiveConfirmationRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm: { type: boolean, const: true }

    GeoIpConfig:
      type: object
      additionalProperties: false
      required: [enabled, source, schedule, country, asn, city]
      properties:
        enabled: { type: boolean, default: false }
        source:
          type: string
          enum: [community, urls, files, maxmind, dbip, ipinfo]
          default: urls
          description: Built-in MaxMind GeoLite2, DB-IP Lite and IPinfo Lite providers, or operator-supplied HTTPS URLs or local files. Community is retained for legacy bundles.
        schedule: { type: string, enum: [weekly, daily, manual], default: weekly }
        country: { $ref: "#/components/schemas/GeoIpDatabaseConfig" }
        asn: { $ref: "#/components/schemas/GeoIpDatabaseConfig" }
        city: { $ref: "#/components/schemas/GeoIpDatabaseConfig" }
        account_id:
          type: string
          description: Numeric MaxMind account ID. Omitted for other sources.

    GeoIpConfigRequest:
      type: object
      additionalProperties: false
      required: [enabled, source, schedule, country, asn, city]
      properties:
        enabled: { type: boolean }
        source: { type: string, enum: [community, urls, files, maxmind, dbip, ipinfo] }
        schedule: { type: string, enum: [weekly, daily, manual] }
        country: { $ref: "#/components/schemas/GeoIpDatabaseConfig" }
        asn: { $ref: "#/components/schemas/GeoIpDatabaseConfig" }
        city: { $ref: "#/components/schemas/GeoIpDatabaseConfig" }
        account_id:
          type: string
          description: Required for enabled MaxMind configurations.
        access_key:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
          description: MaxMind license key or IPinfo token. Omit to reuse the key for the same provider and account.

    GeoIpDatabaseConfig:
      type: object
      additionalProperties: false
      required: [enabled, location]
      properties:
        enabled: { type: boolean }
        location:
          type: string
          description: Operator URL or absolute server path. Empty for a built-in provider.

    GeoIpDatabaseStatus:
      type: object
      required: [kind, build_epoch_secs, loaded_epoch_secs]
      properties:
        kind: { type: string, enum: [country, asn, city] }
        build_epoch_secs: { type: integer, format: int64 }
        loaded_epoch_secs: { type: integer, format: int64 }
        provenance:
          description: Acquisition metadata for the active verified file. Null or absent for legacy bundles with unknown provenance.
          anyOf: [{ $ref: "#/components/schemas/GeoIpDatabaseProvenance" }, { type: "null" }]

    GeoIpDatabaseProvenance:
      type: object
      additionalProperties: false
      required: [original_location, final_location, fetched_epoch_secs, sha256, database_type]
      properties:
        original_location:
          type: string
          description: Original operator URL or local source path. URL userinfo, all query parameters and fragments are omitted; this identity is not a reusable signed URL.
        final_location:
          type: string
          description: Final redirect URL identity, with the same sanitization, or the local source path.
        fetched_epoch_secs:
          type: integer
          format: int64
          description: Time the selected file finished downloading or was copied from a local source.
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Locally computed SHA-256 of the saved database file, checked on restore. It is not a publisher signature or proof of source authenticity.
        database_type:
          type: string
          description: Database type read from verified MMDB metadata.

    GeoIpStatus:
      type: object
      required: [state, available, active_source, databases, last_error]
      properties:
        state: { type: string, enum: [disabled, empty, ready, updating, error] }
        available: { type: boolean }
        active_source: { type: [string, "null"], enum: [community, urls, files, maxmind, dbip, ipinfo, null] }
        databases: { type: array, items: { $ref: "#/components/schemas/GeoIpDatabaseStatus" } }
        last_error:
          type: [string, "null"]
          enum: [data_dir_required, source_unavailable, source_unconfirmed, source_not_regular, source_too_large, download_failed, download_too_large, provider_access_denied, database_invalid, database_type_mismatch, activation_failed, null]
          description: Stable safe GeoIP error code; never a URL, filesystem path, query, or exception text.

    GeoIpSettings:
      type: object
      required: [config, status]
      properties:
        config: { $ref: "#/components/schemas/GeoIpConfig" }
        status: { $ref: "#/components/schemas/GeoIpStatus" }
        access_key_saved:
          type: boolean
          description: True when a provider access key is stored. The key is never returned.

    GeographyRange:
      type: "string"
      enum: ["now","24h","7d","30d"]
    GeographyFamily:
      type: "string"
      enum: ["all","4","6"]
    GeographyTotals:
      type: "object"
      additionalProperties: false
      required: ["unique_ips","accounts","country_count","location_count"]
      properties:
        unique_ips:
          type: "integer"
          format: "int64"
          minimum: 0
        accounts:
          type: "integer"
          format: "int64"
          minimum: 0
        country_count:
          type: "integer"
          format: "int64"
          minimum: 0
        location_count:
          type: "integer"
          format: "int64"
          minimum: 0
    GeographyQuality:
      type: "object"
      additionalProperties: false
      required: ["located","country_only","private","not_found","unavailable","coordinate_coverage","geo_conflicts"]
      properties:
        located:
          type: "integer"
          format: "int64"
          minimum: 0
        country_only:
          type: "integer"
          format: "int64"
          minimum: 0
        private:
          type: "integer"
          format: "int64"
          minimum: 0
        not_found:
          type: "integer"
          format: "int64"
          minimum: 0
        unavailable:
          type: "integer"
          format: "int64"
          minimum: 0
        coordinate_coverage:
          type: ["number","null"]
          minimum: 0
          maximum: 1
        geo_conflicts:
          type: "integer"
          format: "int64"
          minimum: 0
    GeographySource:
      type: "object"
      additionalProperties: false
      required: ["kind","observed_at","age_secs","requested_from","effective_from","retention_days","durable","partial","input_truncated","collection_gap","pending","invalid_users"]
      properties:
        kind:
          type: "string"
          enum: ["live","history"]
        observed_at:
          type: ["integer","null"]
          format: "int64"
          minimum: 1
        age_secs:
          type: ["integer","null"]
          format: "int64"
          minimum: 0
        requested_from:
          type: ["integer","null"]
          format: "int64"
          minimum: 1
        effective_from:
          type: ["integer","null"]
          format: "int64"
          minimum: 1
        retention_days:
          type: ["integer","null"]
          format: "int64"
          minimum: 0
        durable:
          type: ["boolean","null"]
        partial:
          type: "boolean"
        input_truncated:
          type: "boolean"
        collection_gap:
          type: "boolean"
        pending:
          type: "boolean"
        invalid_users:
          type: "integer"
          format: "int64"
          minimum: 0
    GeographyCountry:
      type: "object"
      additionalProperties: false
      required: ["id","country_code","name","name_ru","unique_ips","accounts"]
      properties:
        id:
          type: "string"
        country_code:
          type: "string"
          pattern: "^[A-Z]{2}$"
        name:
          type: "string"
          maxLength: 80
        name_ru:
          type: "string"
          maxLength: 80
        unique_ips:
          type: "integer"
          format: "int64"
          minimum: 0
        accounts:
          type: "integer"
          format: "int64"
          minimum: 0
    GeographyPosition:
      type: "object"
      additionalProperties: false
      required: ["latitude","longitude","accuracy_radius_km"]
      properties:
        latitude:
          type: "number"
          minimum: -90
          maximum: 90
        longitude:
          type: "number"
          minimum: -180
          maximum: 180
        accuracy_radius_km:
          type: ["integer","null"]
          format: "int64"
          minimum: 0
          maximum: 4294967295
    GeographyLocation:
      type: "object"
      additionalProperties: false
      required: ["id","country_code","name","name_ru","city_id","location","unique_ips","accounts"]
      properties:
        id:
          type: "string"
          maxLength: 160
        country_code:
          type: ["string","null"]
          pattern: "^[A-Z]{2}$"
        name:
          type: ["string","null"]
          maxLength: 80
        name_ru:
          type: ["string","null"]
          maxLength: 80
        city_id:
          type: ["integer","null"]
          minimum: 1
          maximum: 4294967295
        location:
          anyOf: [{"$ref":"#/components/schemas/GeographyPosition"},{"type":"null"}]
        unique_ips:
          type: "integer"
          format: "int64"
          minimum: 0
        accounts:
          type: "integer"
          format: "int64"
          minimum: 0
    GeographyVisible:
      type: "object"
      additionalProperties: false
      required: ["points","total_coordinate_locations","omitted_points","countries","total_countries","omitted_countries"]
      properties:
        points:
          type: "integer"
          format: "int64"
          minimum: 0
          maximum: 200
        total_coordinate_locations:
          type: "integer"
          format: "int64"
          minimum: 0
        omitted_points:
          type: "integer"
          format: "int64"
          minimum: 0
        countries:
          type: "integer"
          format: "int64"
          minimum: 0
          maximum: 250
        total_countries:
          type: "integer"
          format: "int64"
          minimum: 0
        omitted_countries:
          type: "integer"
          format: "int64"
          minimum: 0
    GeographyServer:
      type: "object"
      additionalProperties: false
      required: ["state","origin","label","location"]
      properties:
        state:
          type: "string"
          enum: ["hidden","ready","unresolved"]
        origin:
          type: ["string","null"]
          enum: ["manual","geoip",null]
        label:
          type: "string"
          maxLength: 80
        location:
          anyOf: [{"$ref":"#/components/schemas/GeoIpLocation"},{"type":"null"}]
    GeographyOverview:
      type: "object"
      additionalProperties: false
      required: ["snapshot_id","generated_at","expires_at","as_of","served_at","range","family","state","totals","quality","source","geoip","countries","points","visible","selection","server"]
      properties:
        snapshot_id:
          type: "string"
          pattern: "^[a-f0-9]{32}$"
        generated_at:
          type: "integer"
          format: "int64"
          minimum: 1
        expires_at:
          type: "integer"
          format: "int64"
          minimum: 1
        as_of:
          type: "integer"
          format: "int64"
          minimum: 1
        served_at:
          type: "integer"
          format: "int64"
          minimum: 1
        range:
          $ref: "#/components/schemas/GeographyRange"
        family:
          $ref: "#/components/schemas/GeographyFamily"
        state:
          type: "string"
          enum: ["ready","partial","empty","stale","unavailable"]
        totals:
          anyOf: [{"$ref":"#/components/schemas/GeographyTotals"},{"type":"null"}]
        quality:
          anyOf: [{"$ref":"#/components/schemas/GeographyQuality"},{"type":"null"}]
        source:
          $ref: "#/components/schemas/GeographySource"
        geoip:
          $ref: "#/components/schemas/GeoIpStatus"
        countries:
          type: "array"
          maxItems: 250
          items:
            $ref: "#/components/schemas/GeographyCountry"
        points:
          type: "array"
          maxItems: 200
          items:
            $ref: "#/components/schemas/GeographyLocation"
        visible:
          $ref: "#/components/schemas/GeographyVisible"
        selection:
          oneOf: [{"$ref":"#/components/schemas/GeographyCountry"},{"$ref":"#/components/schemas/GeographyLocation"},{"type":"null"}]
        server:
          $ref: "#/components/schemas/GeographyServer"
    GeographyLocationPage:
      type: "object"
      additionalProperties: false
      required: ["snapshot_id","items","total","next_cursor"]
      properties:
        snapshot_id:
          type: "string"
        items:
          type: "array"
          maxItems: 100
          items:
            oneOf: [{"$ref":"#/components/schemas/GeographyCountry"},{"$ref":"#/components/schemas/GeographyLocation"}]
        total:
          type: "integer"
          format: "int64"
          minimum: 0
        next_cursor:
          type: ["string","null"]
          maxLength: 1024
    GeographyUser:
      type: "object"
      additionalProperties: false
      required: ["username","unique_ips"]
      properties:
        username:
          type: "string"
          maxLength: 256
        unique_ips:
          type: "integer"
          format: "int64"
          minimum: 0
    GeographyUserPage:
      type: "object"
      additionalProperties: false
      required: ["snapshot_id","group_id","items","total","next_cursor"]
      properties:
        snapshot_id:
          type: "string"
        group_id:
          type: "string"
        items:
          type: "array"
          maxItems: 100
          items:
            $ref: "#/components/schemas/GeographyUser"
        total:
          type: "integer"
          format: "int64"
          minimum: 0
        next_cursor:
          type: ["string","null"]
          maxLength: 1024
    ServerLocationConfig:
      type: "object"
      additionalProperties: false
      required: ["mode","label","public_ip","latitude","longitude"]
      properties:
        mode:
          type: "string"
          enum: ["hidden","manual","ip"]
        label:
          type: "string"
          maxLength: 80
        public_ip:
          type: ["string","null"]
          maxLength: 45
        latitude:
          type: ["number","null"]
          minimum: -90
          maximum: 90
        longitude:
          type: ["number","null"]
          minimum: -180
          maximum: 180
    GeographySettings:
      type: "object"
      additionalProperties: false
      required: ["server_location"]
      properties:
        server_location:
          $ref: "#/components/schemas/ServerLocationConfig"
    GeographyError:
      type: "object"
      additionalProperties: false
      required: ["code","message"]
      properties:
        code:
          type: "string"
          enum: ["bad_request","not_found","geography_snapshot_expired","geography_source_changed","geography_busy","geography_capacity","geography_timeout","internal_error"]
        message:
          type: "string"

    GeoIpResult:
      type: object
      required: [state, country_code, country_name, country_name_ru, city, city_ru, asn, organization, city_id, location]
      properties:
        state: { type: string, enum: [found, private, not_found] }
        country_code: { type: string }
        country_name: { type: string }
        country_name_ru: { type: string }
        city: { type: string }
        city_ru: { type: string }
        asn: { type: integer, format: int64, minimum: 0 }
        organization: { type: string }
        city_id: { type: [integer, "null"], format: int64, minimum: 1, maximum: 4294967295 }
        location:
          anyOf: [{ $ref: '#/components/schemas/GeoIpLocation' }, { type: "null" }]

    GeoIpLocation:
      type: object
      required: [latitude, longitude, accuracy_radius_km]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_radius_km: { type: [integer, "null"], minimum: 0, maximum: 65535 }
