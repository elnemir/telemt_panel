  /api/nodes/{node_id}/manage/history:
    parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^(default|n_[0-9a-f]{32})$
    get:
      tags:
        - nodes
      operationId: managedGetHistory
      description: >-
        Node-scoped management. Uses only the selected node client, history, jobs and SSE. Legacy default
        history stays with default. Metric history from the active store. Live samples use a bounded two-hour
        RAM buffer even when disk persistence is disabled. Durable stores also return non-overlapping 5-minute
        aggregates for seven days and hourly aggregates for older history. Existing 1-minute / 15-minute rows
        remain readable during migration. Responses exceeding 4096 points are combined into hourly aggregates,
        preserving extrema and sample weights rather than discarding points. Aggregate points expose the average
        or last counter value (`v`), minimum and maximum, observation bounds, sample counts and detected gaps.
        Never errors on empty/partial history — a metric with nothing recorded yet (or a `range` longer than
        what's retained) is 200 with however many points actually exist, even zero.
      parameters:
        - name: metric
          in: query
          required: true
          description: >
            Global series name or a typed entity series such as `dc.-2.rtt_ms`, `dc.2.coverage_pct`,
            `upstream.7.healthy`.
          schema:
            type: string
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum:
              - 15m
              - 30m
              - 1h
              - 24h
              - 7d
              - 30d
              - 90d
      responses:
        '200':
          description: Series (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorySeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          $ref: '#/components/responses/HistoryTimeout'
