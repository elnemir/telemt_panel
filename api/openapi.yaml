        in: path
        required: true
        schema:
          type: string
          pattern: ^(default|n_[0-9a-f]{32})$
    get:
      tags:
        - nodes
      operationId: managedGetTelemtConfig
      description: >-
        Node-scoped management. Uses only the selected node client, history, jobs and SSE. Legacy default
        history stays with default. Passthrough of Telemt's GET /v1/config: editable sections plus the revision
        to chain into a later PATCH's If-Match. Editing requires the Telemt Config API; the legacy
        telemt.config_edit_mode value does not select a file writer.
      responses:
        '200':
          description: Editable sections + revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemtConfig'
        '404':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/TelemtUnreachable'
        '503':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - nodes
      operationId: managedPatchTelemtConfig
      description: >-
        Node-scoped management. Uses only the selected node client, history, jobs and SSE. Legacy default
        history stays with default. Passthrough of Telemt's PATCH /v1/config. The revision travels as an
        `If-Match` header (required — from a prior GET's `revision`), not a body field. An inline reload can be
        requested via query parameters, forwarded to Telemt's own `reload`/`timeout_secs`/`failure_policy` query
        (07-telemt-sdk.md §Config); omitting `reload` patches without reloading. Configuration writes have a
        bounded 60-second wait for DNS preparation and reload. An unconfirmed transport outcome must be checked
        with GET before an explicit retry; the panel never automatically repeats the write.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
        - name: reload
          in: query
          schema:
            type: string
            enum:
              - instant
              - drain
        - name: timeout_secs
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3600
        - name: failure_policy
          in: query
          schema:
            type: string
            enum:
              - keep_new
              - rollback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemtConfigPatch'
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemtConfigPatchResult'
        '202':
          description: Applied and inline reload accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemtConfigPatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/TelemtReadOnly'
        '404':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            access_not_editable | section_not_editable | field_not_editable | config_patch_not_atomic |
            ambiguous_listeners — the patch itself is not applicable, regardless of the HTTP status Telemt used
            internally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Preflight upstream failure or telemt_config_outcome_unknown after an unconfirmed write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: >-
            telemt_config_outcome_unknown — timed out waiting for write confirmation; check current
            configuration before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
