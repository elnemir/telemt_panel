        name: { type: string }
        content: { type: string }
        tree:
          anyOf:
            - { $ref: '#/components/schemas/ConfigTree' }
            - { type: 'null' }
    ConfigFileSnapshot:
      type: object
      required: [protocol, revision, sources]
      properties:
        protocol: { type: integer, const: 1 }
        revision: { type: string }
        sources: { type: array, items: { $ref: '#/components/schemas/ConfigFileSource' } }
    ConfigFileInput:
      type: object
      additionalProperties: false
      required: [revision, source_id, content]
      properties:
        revision: { type: string, pattern: '^[0-9a-f]{64}$' }
        source_id: { type: string, pattern: '^[0-9a-f]{64}$' }
        content: { type: string, maxLength: 8388608 }
        edits:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [path, literal]
            properties:
              path:
                type: array
                minItems: 1
                maxItems: 32
                items:
                  oneOf:
                    - { type: string, maxLength: 256 }
                    - { type: integer, minimum: 0 }
              literal: { type: [string, 'null'], description: TOML value literal; null removes the selected key or array item. }
    ConfigFileResult:
      type: object
      required: [protocol, revision, runtime_convergence]
      properties:
        protocol: { type: integer, const: 1 }
        revision: { type: string }
        valid: { type: boolean }
        persisted: { type: boolean }
        runtime_convergence: { type: string, const: unknown }
        restart_may_be_required: { type: boolean }
    ConfigFileRendered:
      type: object
      required: [protocol, revision, content, tree]
      properties:
        protocol: { type: integer, const: 1 }
        revision: { type: string }
        content: { type: string }
        tree: { $ref: '#/components/schemas/ConfigTree' }
    ConfigFileBackup:
      type: object
      required: [id, created, revision, source]
      properties:
        id: { type: string }
        created: { type: integer, format: int64 }
        revision: { type: string }
        source: { $ref: '#/components/schemas/ConfigFileSource' }
    AgentCommand:
      type: object
      required: [key, action, started, status]
      properties:
        key: { type: string }
        action: { type: string }
        started: { type: integer, format: int64 }
        status:
          type: integer
          description: Saved HTTP result status; zero is an unresolved intent. Never retry an unresolved command automatically.
        body:
          type: object
          additionalProperties: true
    NodeUpgradeInput:
      type: object
      additionalProperties: false
      required: [ssh_port, ssh_user, host_fingerprint, telemt, agent, request_id]
      properties:
        ssh_port: { type: integer, minimum: 1, maximum: 65535 }
        ssh_user: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_-]{0,63}$', description: SSH account with UID zero. }
        host_fingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        telemt: { type: boolean, description: Apply the approved Telemt artifact, if configured. }
        agent: { type: boolean, description: Update the agent and its HTTPS gateway to the panel build. }
        enable_management: { type: boolean, default: false, description: Migrate an installer-owned agent profile to the full profile with service control and configuration files. Requires both components. }
        request_id: { type: string, pattern: '^[a-f0-9]{32}$' }
    NodeUpgradeStatus:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        telemt_version: { type: string, description: Approved target Telemt version; omitted when no artifact is configured. }
        agent_version: { type: string, description: Target version for the agent and its HTTPS gateway. }
        job: { $ref: '#/components/schemas/NodeUpgradeJob' }
    NodeUpgradeJob:
      type: object
      required: [request_id, state]
      properties:
        request_id: { type: string }
        state:
          type: string
          enum: [checking_host, staging, restarting, checking, rolling_back, updated, unchanged, rolled_back, failed, unconfirmed]
        code: { type: string }
    NodeInstallInput:
      type: object
      additionalProperties: false
      required: [name, host, ssh_port, ssh_user, host_fingerprint, proxy_port, management_port]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        host: { type: string, maxLength: 64, description: IPv4 or IPv6 address reachable from the panel for SSH and HTTPS management. }
        ssh_port: { type: integer, minimum: 1, maximum: 65535 }
        ssh_user: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_-]{0,63}$', description: SSH account with UID zero on the clean host. }
        host_fingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        proxy_port: { type: integer, minimum: 1, maximum: 65535 }
        management_port: { type: integer, minimum: 1024, maximum: 65535 }
        with_agent: { type: boolean, default: true, description: Install the full management profile. Set false for a Control API-only installation. }
    NodeInstallPlan:
      type: object
      additionalProperties: false
      required: [name, host, ssh_port, ssh_user, host_fingerprint, proxy_port, management_port, with_agent, architecture, panel_peer, release, api_url]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        host: { type: string, maxLength: 64, description: IPv4 or IPv6 address reachable from the panel for SSH and HTTPS management. }
        ssh_port: { type: integer, minimum: 1, maximum: 65535 }
        ssh_user: { type: string, pattern: '^[a-zA-Z_][a-zA-Z0-9_-]{0,63}$', description: SSH account with UID zero on the clean host. }
        host_fingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        proxy_port: { type: integer, minimum: 1, maximum: 65535 }
        management_port: { type: integer, minimum: 1024, maximum: 65535 }
        with_agent: { type: boolean }
        architecture: { type: string }
        panel_peer: { type: string }
        release: { type: string }
        api_url: { type: string, format: uri }
        config_files: { type: boolean, description: A pinned compatible Telemt build is planned and the file editor must respond before registration. }
    NodeInstallJob:
      type: object
      required: [id, plan, state]
      properties:
        id: { type: string }
        plan: { $ref: '#/components/schemas/NodeInstallPlan' }
        state:
          type: string
          enum: [prepared, checking_host, downloading, installing, checking, installed, failed]
        code: { type: string }
        node_id: { type: string }
    NodeInput:
      type: object
      additionalProperties: false
      required:
        - name
        - api_url
        - enabled
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        api_url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            Absolute HTTP(S) URL, optional base path; no userinfo, query, fragment, encoded or dot segments.
            Private addresses are allowed.
        enabled:
          type: boolean
        auth_header_env:
          type: string
          maxLength: 128
          description: >-
            Environment variable containing exact Authorization value. Empty disables auth. A missing/empty
            referenced variable prevents requests.
          pattern: ^([A-Za-z_][A-Za-z0-9_]{0,127})?$
        agent_url:
          type: string
          maxLength: 2048
          description: Optional agent HTTPS URL (HTTP only on loopback); supply all three agent fields. Immutable once bound.
        agent_id:
          type: string
          maxLength: 128
          description: Expected installed agent identity; immutable once bound. 16-128 ASCII letters, digits, underscores or hyphens.
        agent_auth_env:
          type: string
          maxLength: 128
          description: Panel process environment variable with exact agent Authorization value (at least 32 characters). Never a token value.
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 256
    Node:
      type: object
      required:
        - name
        - api_url
        - enabled
        - labels
        - id
        - source
        - revision
        - auth_configured
        - created_at
        - updated_at
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        api_url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            Absolute HTTP(S) URL, optional base path; no userinfo, query, fragment, encoded or dot segments.
            Private addresses are allowed.
        enabled:
          type: boolean
        auth_header_env:
          type: string
          maxLength: 128
          description: >-
            Environment variable containing exact Authorization value. Empty disables auth. A missing/empty
            referenced variable prevents requests.
          pattern: ^([A-Za-z_][A-Za-z0-9_]{0,127})?$
        agent_url:
          type: string
          maxLength: 2048
          description: Optional agent HTTPS URL (HTTP only on loopback); supply all three agent fields. Immutable once bound.
        agent_id:
          type: string
          maxLength: 128
          description: Expected installed agent identity; immutable once bound. 16-128 ASCII letters, digits, underscores or hyphens.
        agent_auth_env:
          type: string
          maxLength: 128
          description: Panel process environment variable with exact agent Authorization value (at least 32 characters). Never a token value.
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 256
        id:
          type: string
        source:
          type: string
          enum:
            - registry
            - configuration
        revision:
          type: integer
          format: int64
          minimum: 1
        managed_credentials:
          type: boolean
          description: The installer owns the credentials and TLS trust for this node.
        auth_configured:
          type: boolean
          description: Credential reference/configuration present; does not prove it is resolvable.
        created_at:
          type: string
          format: date-time
          description: Zero timestamp for configuration-managed default.
        updated_at:
          type: string
          format: date-time
    NodeList:
      type: object
      required:
        - nodes
        - state_durable
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        state_durable:
          type: boolean
          description: False means registry disappears at process restart, like the existing panel state policy.
        ssh_install_available:
          type: boolean
          description: The panel is configured to install clean hosts using its server-side SSH key.
    NodeHealthSnapshot:
      type: object
      required:
        - node_id
        - node_revision
        - data
      properties:
        node_id:
          type: string
        node_revision:
          type: integer
          format: int64
          minimum: 1
        data:
          type: object
          required:
            - status
            - read_only
          properties:
            status:
              type: string
            read_only:
              type: boolean
      description: Snapshot from the selected node.
    NodeUsersSnapshot:
      type: object
      required:
        - node_id
        - node_revision
        - data
      properties:
        node_id:
          type: string
        node_revision:
          type: integer
          format: int64
          minimum: 1
        revision:
          type: string
          description: Telemt source revision, distinct from node_revision.
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
      description: Telemt users without panel traffic/quota/subpage enrichment. Optional panel-only User fields are absent.
    NodeConfigSnapshot:
      type: object
      required:
        - node_id
        - node_revision
        - data
      properties:
        node_id:
          type: string
        node_revision:
          type: integer
          format: int64
          minimum: 1
        revision:
          type: string
          description: Telemt source revision, distinct from node_revision.
        data:
          type: object
          additionalProperties: {}
      description: Snapshot from the selected node.
    QuotaScheduleRule:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [interval, cron] }
        days: { type: integer, minimum: 1, maximum: 3650000 }
        start: { type: string, format: date }
        time: { type: string, description: 'Local HH:mm in the panel schedule timezone.' }
        cron: { type: string, maxLength: 160, description: 'Five fields; no seconds, command, macros or extensions. Day-of-month and weekday use OR.' }
    GlobalQuotaSchedule:
      type: object
      required: [enabled, timezone, rule]
      properties:
        enabled: { type: boolean }
        timezone: { type: string, description: 'IANA timezone; server resolves to the current server zone on save.' }
        rule: { $ref: "#/components/schemas/QuotaScheduleRule" }
    UserQuotaSchedule:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [inherit, custom, off] }
        rule: { $ref: "#/components/schemas/QuotaScheduleRule" }
    ScheduledQuotaRun:
      type: object
      required: [id, state, started_at, total]
      properties:
        id: { type: string }
        state: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        total: { type: integer }
        confirmed: { type: integer, description: 'Absent when a restart prevented observing the result; not zero.' }
        unknown: { type: integer }
        rejected: { type: integer }
        remaining: { type: integer }
        reason: { type: string }
    QuotaScheduleView:
      type: object
      required: [revision, global, effective, server_timezone, effective_timezone, durable, next_runs, custom_count, excluded_count]
      properties:
        revision: { type: string }
        global: { $ref: "#/components/schemas/GlobalQuotaSchedule" }
        policy: { $ref: "#/components/schemas/UserQuotaSchedule" }
        effective: { type: boolean }
        server_timezone: { type: string }
        effective_timezone: { type: string }
        durable: { type: boolean }
        next_runs: { type: array, items: { type: string, format: date-time } }
        next_due: { type: string, format: date-time }
        custom_count: { type: integer }
        excluded_count: { type: integer }
        last: { $ref: "#/components/schemas/ScheduledQuotaRun" }
        error: { type: string }
    QuotaResetConfirmation:
      type: object
      required: [token, total, expires_at]
      properties:
        token: { type: string, minLength: 32, maxLength: 32 }
        total: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
    QuotaResetIssue:
      type: object
      required: [username, outcome, code]
      properties:
        username: { type: string }
        outcome: { type: string, enum: [rejected, unknown] }
        code: { type: string, enum: [not_found, read_only, revision_conflict, telemt_auth_failed, capability_absent, reset_unconfirmed] }
    QuotaResetOperation:
      type: object
      required: [id, state, total, processed, confirmed, rejected, unknown, remaining, reason, started_at, issues, issues_total]
      properties:
        id: { type: string }
        trigger: { type: string, enum: [schedule], description: Absent for manually confirmed operations. }
        state: { type: string, enum: [running, completed, stopped] }
        total: { type: integer }
        processed: { type: integer }
        confirmed: { type: integer }
        rejected: { type: integer }
        unknown: { type: integer }
        remaining: { type: integer }
        reason: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        issues: { type: array, items: { $ref: "#/components/schemas/QuotaResetIssue" } }
        issues_total: { type: integer }
        next_offset: { type: integer }
    LinkSettings:
      type: object
      additionalProperties: false
      required: [allow_address_override]
      properties:
        allow_address_override:
          type: boolean
          default: false
          description: Allow explicit selection of a configured censorship.tls_domains value as the connection address in the Access tab. Does not modify Telemt configuration or TLS secrets.
    SubscriptionPageCopy:
      type: object
      additionalProperties: false
      required: [title, description, instructions, support_label]
      properties:
        title: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 400 }
        instructions: { type: string, maxLength: 1500 }
        support_label: { type: string, maxLength: 60 }
    SubscriptionAppearance:
      type: object
      additionalProperties: false
      required: [language, theme, accent, logo, ru, en, support_url, hidden, connections]
      properties:
        language: { type: string, enum: [auto, ru, en] }
        theme: { type: string, enum: [auto, light, dark] }
        accent: { type: string, enum: [blue, emerald, violet, amber] }
        logo: { type: string, enum: [initial, panel, hidden] }
        ru: { $ref: "#/components/schemas/SubscriptionPageCopy" }
        en: { $ref: "#/components/schemas/SubscriptionPageCopy" }
        support_url: { type: string, maxLength: 512, description: Empty or an HTTPS URL without credentials. }
        hidden:
          type: array
          uniqueItems: true
          items: { type: string, enum: [status, quota, expiry, qr, manual, instructions, fallback] }
        connections:
