# Telemt Panel v2 — HTTP contract (source of truth).
# Server stubs: oapi-codegen. TS client + TanStack Query hooks: hey-api/openapi-ts.
# Conventions (differ from v1 — no {ok,data} envelope):
#   - plain HTTP status codes; success bodies are the resource itself
#   - errors: application/json {code, message} with proper status (schema Error)
#   - auth: opaque session id in HttpOnly cookie "panel_session"
#   - realtime is SSE (/api/events*), documented here as text/event-stream;
#     event payload shapes follow the generated topic types
#   - x-status: planned marks a path with no route registered yet in
#     internal/httpapi/server.go (M3 backlog) — audited against the actual
#     route table, not aspirational; absence of the tag means implemented
openapi: 3.1.0
info:
  title: Telemt Panel API
  version: 2.0.0-draft1
  description: >
    Admin API of Telemt Panel v2 plus the unauthenticated subscription page.
    Telemt-shaped payloads follow the upstream API models.

servers:
  - url: /
    description: Same origin; base_path is prepended by the SPA runtime when configured.

tags:
  - { name: auth }
  - { name: users }
  - { name: nodes }
  - { name: telemt }
  - { name: host }
  - { name: updates }
  - { name: realtime }
  - { name: misc }
  - { name: subpage }

security:
  - session: []

# Standalone mode (control_plane_only=true): legacy node-owned /api/users,
# /telemt, /history, /traffic, /events, /snapshot, /geography, /audit, /logs,
# /updates and node settings return 404 Error(code=node_not_found).
