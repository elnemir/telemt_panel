              schema: { $ref: '#/components/schemas/NodeInstallJob' }
        '400': { $ref: '#/components/responses/NodeInstallError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NodeInstallError' }
        '409': { $ref: '#/components/responses/NodeInstallError' }
