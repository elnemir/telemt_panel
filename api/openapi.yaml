        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: CSRF rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: Upload exceeds the size limit, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { description: Persistent panel data directory is not configured, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/settings/subscription:
    get:
      tags: [settings]
      operationId: getSubscriptionAppearance
      description: Read the global subscription page appearance and its revision.
      responses:
        "200":
          description: Subscription page appearance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionAppearanceSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [settings]
      operationId: putSubscriptionAppearance
      description: Apply appearance to subscription pages immediately. The revision prevents overwriting another edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionAppearanceSnapshot" }
      responses:
        "200":
          description: Saved appearance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionAppearanceSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: CSRF rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Appearance revision changed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/settings/subscription/preview:
    post:
      tags: [settings]
      operationId: previewSubscriptionAppearance
      description: Render the draft using sample data. The result contains no live subscriber information and is never persisted.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [ru, en] } }
        - { name: state, in: query, schema: { type: string, enum: [active, disabled, expired, quota_exhausted], default: active } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionAppearance" }
      responses:
        "200":
          description: Preview HTML
          content:
            text/html:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: CSRF rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/settings/tls:
    parameters:
      - { name: target, in: query, schema: { type: string, enum: [panel, subscription], default: panel } }
    get:
      tags: [misc]
      operationId: getPanelTls
      description: Active runtime status of the panel listener, not Telemt TLS masking. Saved transport changes become active only after restart.
      responses:
        "200":
          description: Panel transport and certificate status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelTlsStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/settings/panel-config:
    get:
      tags: [settings]
      operationId: getPanelConfigSettings
      description: Read the panel's own active, startup, and saved editable settings. This is a global endpoint.
      responses:
        "200":
          description: Panel configuration form values
          content: { application/json: { schema: { $ref: "#/components/schemas/PanelConfigSettings" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PanelConfigError" }
        "500": { $ref: "#/components/responses/PanelConfigError" }
    put:
      tags: [settings]
      operationId: savePanelConfigSettings
      description: Validate and atomically save overrides against the current revision. The running process keeps its active settings until restart.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PanelConfigSettingsRequest" } } }
      responses:
        "200":
          description: Saved panel settings
          content: { application/json: { schema: { $ref: "#/components/schemas/PanelConfigSettings" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PanelConfigError" }
        "409": { $ref: "#/components/responses/PanelConfigError" }
        "422": { $ref: "#/components/responses/PanelConfigError" }
        "500": { $ref: "#/components/responses/PanelConfigError" }

  /api/settings/panel-config/preview:
    post:
      tags: [settings]
      operationId: previewPanelConfigSettings
      description: Validate the draft against the current revision and return normalized effective values without saving.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PanelConfigSettingsRequest" } } }
      responses:
        "200":
          description: Validated effective settings
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/PanelConfigValues"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PanelConfigError" }
        "409": { $ref: "#/components/responses/PanelConfigError" }
        "422": { $ref: "#/components/responses/PanelConfigError" }
        "500": { $ref: "#/components/responses/PanelConfigError" }

  /api/settings/tls/config:
    parameters:
      - { name: target, in: query, schema: { type: string, enum: [panel, subscription], default: panel } }
    get:
      tags: [misc]
      operationId: getPanelTlsConfig
      description: Active and disk transport configurations, preparation state and manual capabilities. Admin only; never returns key/config contents.
      responses:
        "200":
          description: Transport settings; configured is omitted if startup file is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/PanelTlsSettings" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [misc]
      operationId: putPanelTlsConfig
      description: >
        Atomically save the exact normalized candidate returned by preparation.
        Receipt expires after five minutes, is single-use, and binds the original file revision.
        PEM certificate/key availability is rechecked at save. ACME apply verifies the exact prepared chain and matching key from the cache, current validity/system trust and cache write permissions without contacting the CA or reissuing. Only the selected endpoint's listen, TLS, public URL, path and enabled flag change; TOML formatting/comments are normalized. First subscription enable creates a missing signing key; existing keys are retained.
        A fixed .bak file retains original bytes; saved file and backup use mode 0600.
        Requires prepare capability. Managed HTTPS uses an override in persistent panel storage and leaves the startup file intact. Restart may be performed manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receipt, candidate]
              properties:
                receipt: { type: string }
                candidate: { $ref: "#/components/schemas/PanelTlsCandidate" }
      responses:
        "200":
          description: Saved; running transport remains unchanged until restart
          content: { application/json: { schema: { $ref: "#/components/schemas/PanelTlsSaved" } } }
        "400": { $ref: "#/components/responses/PanelTlsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PanelTlsError" }
        "409": { $ref: "#/components/responses/PanelTlsError" }
        "422": { $ref: "#/components/responses/PanelTlsError" }
        "503": { $ref: "#/components/responses/PanelTlsError" }
  /api/settings/tls/prepare:
    parameters:
      - { name: target, in: query, schema: { type: string, enum: [panel, subscription], default: panel } }
    post:
      tags: [misc]
      operationId: preparePanelTls
      description: >
        Validate and acquire certificates before saving, with current access kept alive.
        One operation at a time; deadline 110 seconds, canceled on disconnect/shutdown.
        ACME runs in the same executable/UID as a bounded subprocess. Public CA trust is verified.
        No CA directory override is accepted. Public reachability of the new panel port is not verified.
        Managed HTTPS uses a persistent ACME cache in the panel data directory. Other installations inherit the existing cache or use certs beside the startup config.
        HTTP behind a reverse proxy is represented by mode http with a loopback listen address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [listen, tls]
              properties:
                listen: { type: string, description: "Bind host:port; numeric port 1..65535" }
                tls: { $ref: "#/components/schemas/PanelTlsConfig" }
                base_path: { type: string, description: Strict URL prefix; reverse proxies must preserve it }
                public_url: { type: string, description: External HTTP(S) origin; a supplied path must match base_path }
                enabled: { type: boolean, description: Only used for target subscription }
                confirm_http: { type: boolean, default: false, description: Required true for non-loopback plain HTTP or an explicit external HTTP URL }
                certificate_upload:
                  type: object
                  description: Panel-only PEM upload. Requires authenticated HTTPS or direct loopback and persistent storage. Exclude file paths from tls.
                  additionalProperties: false
                  required: [certificate_pem, private_key_pem]
                  properties:
                    certificate_pem: { type: string, writeOnly: true, maxLength: 131072, description: Server certificate followed by intermediates in PEM }
                    private_key_pem: { type: string, writeOnly: true, maxLength: 131072, description: Matching unencrypted PEM private key }
      responses:
        "200":
          description: Prepared; no configuration was saved
          content: { application/json: { schema: { $ref: "#/components/schemas/PanelTlsPrepared" } } }
        "400": { $ref: "#/components/responses/PanelTlsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PanelTlsError" }
        "409": { $ref: "#/components/responses/PanelTlsError" }
        "422": { $ref: "#/components/responses/PanelTlsError" }
        "503": { $ref: "#/components/responses/PanelTlsError" }
        "504": { $ref: "#/components/responses/PanelTlsError" }
  /api/settings/tls/restart:
    post:
      tags: [misc]
      operationId: restartPanelTls
      description: >
        Restart only for a transport change saved by this process, after verifying the saved file revision.
        Flush the accepted response before invoking the existing allowlisted service Runner.
        A 202 acknowledges scheduling, not successful service startup. GET config exposes restart_failed if the Runner fails.
      responses:
        "202":
          description: Restart scheduled after response delivery
          content: { application/json: { schema: { $ref: "#/components/schemas/PanelTlsSaved" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PanelTlsError" }
        "409": { $ref: "#/components/responses/PanelTlsError" }
        "503": { $ref: "#/components/responses/PanelTlsError" }
  # ───────────────────────── auth ─────────────────────────
  /api/auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "403": { description: "Authentication disabled, unapproved anonymous host, or cross-site request", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "204": { description: Logged in; session cookie set }
        "400": { description: bad_request — malformed request body, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401":
          description: invalid_credentials
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Session revoked server-side; cookie cleared }
        "500": { description: "session_revoke_failed — durable revoke failed; cookie retained for retry", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Authentication disabled or request rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/auth/methods:
    get:
      tags: [auth]
      security: []
      operationId: getAuthMethods
      description: Public authentication mode and passkey availability. Disabled mode is configured locally, never through this API.
      responses:
        "200":
          description: Available passwordless methods
          content:
            application/json:
              schema:
                type: object
                required: [passkey_available]
                properties:
                  passkey_available: { type: boolean }
                  auth_disabled: { type: boolean, default: false }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        "403": { description: "Authentication disabled, unapproved anonymous host, or cross-site request", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "200":
          description: Current admin identity and enabled auth options
          content:
            application/json:
              schema:
                type: object
                required: [username, passkeys]
                properties:
                  auth_disabled: { type: boolean, default: false, description: "When true, access is anonymous with full admin privileges and no session is issued." }
                  username: { type: string }
                  passkey_management: { type: boolean, description: "False for password-only administrators. Omitted for the configured account." }
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/PasskeyInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/admins:
    get:
      tags: [auth]
      operationId: listAdminAccounts
      description: Panel administrator identities. Password hashes are excluded.
      responses:
        "200":
          description: Accounts and persistence availability
          content:
            application/json:
              schema:
                type: object
                required: [accounts, writable]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAccountInfo" }
                  writable: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminAccountForbidden" }
    post:
      tags: [auth]
      operationId: createAdminAccount
      description: Create a password-based administrator with full panel access after verifying the caller's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, current_password, new_password]
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$' }
                current_password: { type: string, format: password, writeOnly: true }
                new_password: { $ref: "#/components/schemas/NewAdminPassword" }
      responses:
        "204": { description: Account created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminAccountForbidden" }
        "409":
          description: Administrator already exists or the managed administrator limit was reached
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/admins/{username}/delete:
    post:
      tags: [auth]
      operationId: deleteAdminAccount
      description: Verify the caller's password, delete the managed administrator, and revoke their sessions. The configured and current accounts are protected.
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string, format: password, writeOnly: true }
      responses:
        "204": { description: Account deleted and sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminAccountForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/password:
    put:
      tags: [auth]
      operationId: changeAdminPassword
      description: Change the current administrator's password, revoke all their sessions, and clear their current session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password, writeOnly: true }
                new_password: { $ref: "#/components/schemas/NewAdminPassword" }
      responses:
        "204": { description: Password changed and sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminAccountForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      description: Current administrator’s active panel sessions, newest first with the current session pinned. Cursor-paged and searchable by browser/User-Agent or IP address.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor returned by the previous page }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Case-insensitive User-Agent or IP substring }
      responses:
        "403": { description: "Authentication disabled, unapproved anonymous host, or cross-site request", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "200":
          description: Page of active sessions (current one flagged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [auth]
      operationId: revokeOtherSessions
      description: Revoke all sessions for the current administrator except the current one.
      responses:
        "204": { description: Revoked }
        "500": { description: "session_revoke_failed — durable revoke failed", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Authentication disabled or request rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      operationId: revokeSession
      parameters: [ { name: sessionId, in: path, required: true, schema: { type: string } } ]
      responses:
        "403": { description: "Authentication disabled, unapproved anonymous host, or cross-site request", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "204": { description: Revoked }
        "500": { description: "session_revoke_failed — durable revoke failed", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # WebAuthn: public_key and credential are the standard WebAuthn JSON shapes.
  /api/auth/webauthn/register/begin:
    post:
      tags: [auth]
      operationId: webauthnRegisterBegin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnRegisterBeginRequest" } } }
      responses:
        "403": { description: "Authentication disabled, unapproved anonymous host, or cross-site request", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "200": { description: CredentialCreationOptions and one-time flow ID, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnBeginResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/webauthn/register/finish:
    post:
      tags: [auth]
      operationId: webauthnRegisterFinish
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnFinishRequest" } } } }
      responses:
        "403": { description: "Authentication disabled, unapproved anonymous host, or cross-site request", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "201": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyInfo" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Credential already registered, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/auth/webauthn/login/begin:
    post:
      tags: [auth]
      security: []
      operationId: webauthnLoginBegin
      responses:
        "403": { description: "Authentication disabled, unapproved anonymous host, or cross-site request", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "200": { description: CredentialRequestOptions and one-time flow ID, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnBeginResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/webauthn/login/finish:
    post:
      tags: [auth]
      security: []
      operationId: webauthnLoginFinish
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnFinishRequest" } } } }
      responses:
        "403": { description: "Authentication disabled, unapproved anonymous host, or cross-site request", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "204": { description: Logged in; session cookie set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/webauthn/credentials/{credentialId}:
    delete:
      tags: [auth]
      operationId: webauthnDeleteCredential
      parameters: [ { name: credentialId, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { description: Authentication disabled or request rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/settings/quota-schedule:
    get:
      tags: [settings]
      operationId: getQuotaSchedule
      responses:
        "200":
          description: Common quota schedule and durable execution summary. Disabled by default.
          content: { application/json: { schema: { $ref: "#/components/schemas/QuotaScheduleView" } } }
        default: { $ref: "#/components/responses/QuotaResetError" }
    put:
      tags: [settings]
      operationId: saveQuotaSchedule
      parameters:
        - { in: header, name: If-Match, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GlobalQuotaSchedule" } } }
      responses:
        "200":
          description: Saved for future slots only; does not reset quotas immediately.
          content: { application/json: { schema: { $ref: "#/components/schemas/QuotaScheduleView" } } }
        default: { $ref: "#/components/responses/QuotaResetError" }
  /api/settings/quota-schedule/preview:
    post:
      tags: [settings]
      operationId: previewQuotaSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule, timezone]
              properties:
                rule: { $ref: "#/components/schemas/QuotaScheduleRule" }
                timezone: { type: string }
      responses:
        "200":
          description: Three next instants calculated with the execution calendar; no task is created.
          content:
            application/json:
              schema:
                type: object
                required: [next_runs, effective_timezone]
                properties:
                  next_runs: { type: array, items: { type: string, format: date-time } }
                  effective_timezone: { type: string }
        default: { $ref: "#/components/responses/QuotaResetError" }
  /api/users/{username}/quota-schedule:
    parameters:
      - { in: path, name: username, required: true, schema: { type: string } }
    get:
      tags: [users]
      operationId: getUserQuotaSchedule
      responses:
        "200":
          description: User override and effective common schedule.
          content: { application/json: { schema: { $ref: "#/components/schemas/QuotaScheduleView" } } }
        default: { $ref: "#/components/responses/QuotaResetError" }
    put:
      tags: [users]
      operationId: saveUserQuotaSchedule
      parameters:
        - { in: header, name: If-Match, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserQuotaSchedule" } } }
      responses:
        "200":
          description: Saved user policy for future slots only.
          content: { application/json: { schema: { $ref: "#/components/schemas/QuotaScheduleView" } } }
        default: { $ref: "#/components/responses/QuotaResetError" }
  /api/users/operations/quota-reset/prepare:
    post:
      tags: [users]
      operationId: prepareBulkQuotaReset
      description: Prepare all configured users with a fresh revision. No quota is changed. Confirmation expires in two minutes.
      responses:
        "200":
          description: Explicit confirmation required
          content: { application/json: { schema: { $ref: "#/components/schemas/QuotaResetConfirmation" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/QuotaResetError" }
        "409": { $ref: "#/components/responses/QuotaResetError" }
        "501": { $ref: "#/components/responses/QuotaResetError" }
        "502": { $ref: "#/components/responses/QuotaResetError" }
        "503": { $ref: "#/components/responses/QuotaResetError" }
  /api/users/operations/quota-reset:
    post:
      tags: [users]
      operationId: startBulkQuotaReset
      description: >
        Start one sequential operation for the confirmed revision. An accepted token
        returns the same operation when repeated, never a second reset. No automatic
        retry or restart recovery; limits and panel traffic/IP history stay unchanged.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, minLength: 32, maxLength: 32 } } } } }
      responses:
        "202":
          description: Accepted or previously accepted operation
          content: { application/json: { schema: { $ref: "#/components/schemas/QuotaResetOperation" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/QuotaResetError" }
        "409": { $ref: "#/components/responses/QuotaResetError" }
        "501": { $ref: "#/components/responses/QuotaResetError" }
        "502": { $ref: "#/components/responses/QuotaResetError" }
        "503": { $ref: "#/components/responses/QuotaResetError" }
    get:
      tags: [users]
      operationId: getBulkQuotaReset
      description: Current/last in-memory operation; null before any start. A requested id that was lost/replaced returns 404, never fabricated success.
      parameters:
        - { name: id, in: query, schema: { type: string, maxLength: 32 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Progress and at most 50 exception records
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation: { anyOf: [{ $ref: "#/components/schemas/QuotaResetOperation" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/QuotaResetError" }
        "404": { $ref: "#/components/responses/QuotaResetError" }

  # ───────────────────────── users ─────────────────────────
  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      description: >
        Composite of Telemt GET /v1/users merged with quota usage (when the
        `quota` capability is present) and the panel's subscription URL.
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
    post:
      tags: [users]
      operationId: createUser
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserCreate" } } }
      responses:
        "201":
          description: Created; secret returned exactly once
          content:
            application/json:
              schema:
                type: object
                required: [user, secret]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  secret: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: user_exists, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}:
    parameters: [ { $ref: "#/components/parameters/Username" } ]
    get:
      tags: [users]
      operationId: getUser
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
    patch:
      tags: [users]
      operationId: patchUser
      description: >
        JSON Merge Patch semantics forwarded to Telemt: omitted = unchanged,
        null = remove the limit, value = set.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserPatch" } } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
    delete:
      tags: [users]
      operationId: deleteUser
      responses:
        "204": { description: Deleted }
        "409": { description: last_user_forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}/reset-quota:
    post:
      tags: [users]
      operationId: resetUserQuota
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      responses:
        "200":
          description: Usage zeroed
          content:
            application/json:
              schema:
                type: object
                required: [username, used_bytes, last_reset_epoch_secs]
                properties:
                  username: { type: string }
                  used_bytes: { type: integer, const: 0 }
                  last_reset_epoch_secs: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "409": { $ref: "#/components/responses/QuotaResetError" }
        "503": { $ref: "#/components/responses/QuotaResetError" }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}/ip-history:
    get:
      tags: [users]
      operationId: getUserIPHistory
      description: >
        Panel-observed address history, not a connection log. Ranges end now
        and filter last observation. Live pagination may move updated rows;
        clients should deduplicate by IP and offer refresh. No-store response.
      parameters:
        - { $ref: "#/components/parameters/Username" }
        - { name: range, in: query, schema: { type: string, enum: [24h, 7d, 30d, all], default: 30d } }
        - { name: family, in: query, schema: { type: string, enum: [all, "4", "6"], default: all } }
        - { name: q, in: query, schema: { type: string, maxLength: 64 }, description: Literal IP substring; full addresses are canonicalized. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 }, description: Opaque cursor bound to user and filters. }
      responses:
        "200": { description: Observed addresses and collection limitations, content: { application/json: { schema: { $ref: "#/components/schemas/UserIPHistory" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "504": { $ref: "#/components/responses/HistoryTimeout" }

  /api/users/{username}/ip-history/reset:
    post:
      tags: [users]
      operationId: resetUserIPHistory
      description: Clears only address history, including pending writes. Later observations may create new history. Does not reset traffic or Telemt IP limits.
      parameters:
        - { $ref: "#/components/parameters/Username" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: { type: boolean, const: true }
      responses:
        "504": { $ref: "#/components/responses/HistoryTimeout" }
        "204": { description: IP history cleared }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/users/{username}/traffic-history:
    get:
      tags: [users]
      operationId: getUserTrafficHistory
      description: >
        Optional sparse per-user traffic history. Values are bytes transferred
        inside each bucket, not cumulative Telemt counters. The recent day uses
        15-minute buckets and older history uses hourly buckets; zero intervals
        are omitted.
      parameters:
        - { $ref: "#/components/parameters/Username" }
        - { name: range, in: query, required: true, schema: { type: string, enum: [24h, 7d, 30d, 1y] } }
      responses:
        "504": { $ref: "#/components/responses/HistoryTimeout" }
        "200": { description: User traffic series and collection state, content: { application/json: { schema: { $ref: "#/components/schemas/UserTrafficHistorySeries" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/users/{username}/traffic/reset:
    post:
      tags: [users]
      operationId: resetUserTraffic
      description: >
        Irreversibly removes the panel-observed total, current baseline and
        graph history for one account. The next coherent collector snapshot
        establishes a new baseline.
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestructiveConfirmationRequest" }
      responses:
        "504": { $ref: "#/components/responses/HistoryTimeout" }
        "204": { description: User traffic reset }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/traffic/summary:
    get:
      tags: [users]
      operationId: getTrafficSummary
      parameters:
        - { name: range, in: query, required: true, schema: { $ref: "#/components/schemas/TrafficRange" } }
      responses:
        "504": { $ref: "#/components/responses/HistoryTimeout" }
        "200": { description: Aggregate user traffic report, content: { application/json: { schema: { $ref: "#/components/schemas/TrafficSummary" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/traffic/users:
    get:
      tags: [users]
      operationId: getTrafficUsers
      parameters:
        - { name: range, in: query, required: true, schema: { $ref: "#/components/schemas/TrafficRange" } }
        - { name: include_deleted, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "504": { $ref: "#/components/responses/HistoryTimeout" }
        "200": { description: Ranked user traffic page, content: { application/json: { schema: { $ref: "#/components/schemas/TrafficUsersPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/traffic/reset:
    post:
      tags: [users]
      operationId: resetAllUserTraffic
      description: >
        Irreversibly removes every panel-observed user traffic total, baseline
        and graph bucket. The next coherent collector snapshot establishes new
        baselines.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestructiveConfirmationRequest" }
      responses:
        "504": { $ref: "#/components/responses/HistoryTimeout" }
        "204": { description: All user traffic reset }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/users/{username}/rotate-secret:
    post:
      tags: [users]
      operationId: rotateUserSecret
      description: Rotates the user's secret; implicitly invalidates the old subscription link.
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      responses:
        "200":
          description: New secret returned exactly once
          content:
            application/json:
              schema:
                type: object
                required: [user, secret]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  secret: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "501": { description: capability_absent — not supported on this Telemt build, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}/enabled:
    put:
      tags: [users]
      operationId: setUserEnabled
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "501": { description: capability_absent — not supported on this Telemt build, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/users/{username}/sublink:
    get:
      tags: [users]
      operationId: getUserSublink
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      responses:
        "200":
          description: Current subscription URL for sharing
          content: { application/json: { schema: { $ref: "#/components/schemas/Sublink" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: sublink_unavailable — user has no valid classic/secure/TLS link to derive one from, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
    post:
      tags: [users]
      operationId: regenerateUserSublink
      description: Rotates the per-user nonce; the previous subscription URL stops working.
      parameters: [ { $ref: "#/components/parameters/Username" } ]
      responses:
        "200": { description: New URL, content: { application/json: { schema: { $ref: "#/components/schemas/Sublink" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: sublink_unavailable — user has no valid classic/secure/TLS link to derive one from, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  # ───────────────────────── telemt ─────────────────────────
  /api/telemt/info:
    get:
      tags: [telemt]
      operationId: getTelemtInfo
      responses:
        "200":
          description: Version, connectivity and capability flags (07-telemt-sdk.md §3)
          content: { application/json: { schema: { $ref: "#/components/schemas/TelemtInfo" } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/telemt/config:
    get:
      tags: [telemt]
      operationId: getTelemtConfig
      description: >
        Passthrough of Telemt's GET /v1/config: editable sections plus the revision to
        chain into a later PATCH's If-Match. Editing requires the Telemt Config API;
        the legacy telemt.config_edit_mode value does not select a file writer.
      responses:
        "200":
          description: Editable sections + revision
          content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfig" } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — this Telemt build/config does not expose the config API, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [telemt]
      operationId: patchTelemtConfig
      description: >
        Passthrough of Telemt's PATCH /v1/config. The revision travels as an `If-Match`
        header (required — from a prior GET's `revision`), not a body field. An inline
        reload can be requested via query parameters, forwarded to Telemt's own
        `reload`/`timeout_secs`/`failure_policy` query (07-telemt-sdk.md §Config);
        omitting `reload` patches without reloading.
        Configuration writes have a bounded 60-second wait for DNS preparation and
        reload. An unconfirmed transport outcome must be checked with GET before
        an explicit retry; the panel never automatically repeats the write.
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: reload, in: query, schema: { type: string, enum: [instant, drain] } }
        - { name: timeout_secs, in: query, schema: { type: integer, minimum: 1, maximum: 3600 } }
        - { name: failure_policy, in: query, schema: { type: string, enum: [keep_new, rollback] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigPatch" } } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigPatchResult" } } } }
        "202": { description: Applied and inline reload accepted, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigPatchResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: revision_conflict — re-read and merge
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "422":
          description: >
            access_not_editable | section_not_editable | field_not_editable |
            config_patch_not_atomic | ambiguous_listeners — the patch itself is not
            applicable, regardless of the HTTP status Telemt used internally.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "502": { description: Preflight upstream failure or telemt_config_outcome_unknown after an unconfirmed write, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: capability_unavailable — this Telemt build/config does not expose the config API, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { description: telemt_config_outcome_unknown — timed out waiting for write confirmation; check current configuration before retrying, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/config/toml:
    get:
      tags: [telemt]
      operationId: getTelemtConfigTOML
      description: >
        Returns a normalized TOML projection of the managed Config API sections. It is
        not the source telemt.toml: comments, includes, source ownership and the
        explicit/default distinction are not available through Telemt's Config API.
      responses:
        "200": { description: TOML projection and revision, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigTOML" } } } }
        "500": { description: toml_projection_failed — a Config API value cannot be represented as exact TOML, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [telemt]
      operationId: patchTelemtConfigTOML
      description: >
        Parses the normalized TOML on the panel backend, validates managed paths,
        builds a sparse patch against the current revision and forwards it to Telemt.
        Removing map keys is rejected because the current Config API cannot unset them.
        The write uses the same bounded 60-second wait and unconfirmed-outcome
        handling as the structured configuration PATCH.
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: reload, in: query, schema: { type: string, enum: [instant, drain] } }
        - { name: timeout_secs, in: query, schema: { type: integer, minimum: 1, maximum: 3600 } }
        - { name: failure_policy, in: query, schema: { type: string, enum: [keep_new, rollback] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigTOMLRequest" } } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigPatchResult" } } } }
        "202": { description: Applied and inline reload accepted, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigPatchResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: revision_conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "422": { description: Telemt rejected the generated patch, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: Preflight upstream failure or telemt_config_outcome_unknown after an unconfirmed write, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { description: telemt_config_outcome_unknown — timed out waiting for write confirmation; check current configuration before retrying, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/config/catalog:
    get:
      tags: [telemt]
      operationId: getTelemtConfigCatalog
      description: Versioned metadata for every Telemt 3.5.5 Config API field used by validation and structured settings forms.
      responses:
        "200": { description: Config field catalog, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigCatalog" } } } }

  /api/telemt/config/toml/preview:
    post:
      tags: [telemt]
      operationId: previewTelemtConfigTOML
      description: >
        Parses and validates a TOML projection without applying it. Returns the exact
        sparse JSON patch plus materialized sections and wholesale array replacements.
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigTOMLRequest" } } }
      responses:
        "200": { description: Validated preview, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigTOMLPreview" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: revision_conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/telemt/reload:
    post:
      tags: [telemt]
      operationId: reloadTelemt
      description: >
        Passthrough of Telemt's POST /v1/system/reload — config re-read via the reload
        API (capability `reload_api`), not a service restart. `If-Match`, when sent, is
        forwarded as the mutation's revision.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [instant, drain], default: instant }
                timeout_secs: { type: integer, minimum: 1, maximum: 3600 }
                failure_policy: { type: string, enum: [keep_new, rollback], default: keep_new }
      responses:
        "202": { description: Reload accepted, content: { application/json: { schema: { $ref: "#/components/schemas/ReloadAccepted" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/TelemtReadOnly" }
        "409": { description: reload_in_progress, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent — offer service restart instead, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/telemt/reload/{id}:
    get:
      tags: [telemt]
      operationId: getTelemtReloadStatus
      description: Passthrough of Telemt's GET /v1/system/reload/{id} — poll until State reaches a terminal phase.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200": { description: Reload status, content: { application/json: { schema: { $ref: "#/components/schemas/ReloadStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: reload_not_found — unknown or aged-out id, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/telemt/service:
    get:
      tags: [telemt]
      operationId: getTelemtService
      description: State of the configured service/container on the panel host, observed independently of the Telemt API. Unknown is not equivalent to stopped.
      responses:
        "200":
          description: Service state and independently checked operation capabilities.
          content: { application/json: { schema: { $ref: "#/components/schemas/TelemtServiceState" } } }
  /api/telemt/start:
    post:
      tags: [telemt]
      operationId: startTelemtService
      description: Starts the configured Telemt service, not the panel. Requires explicit host rights; serialized with updates and manual service operations. Does not enable boot startup.
      responses:
        "202": { description: Start command completed; re-read service state rather than assuming readiness. }
        "409": { $ref: "#/components/responses/ServiceControlError" }
        "502": { $ref: "#/components/responses/ServiceControlError" }
        "503": { $ref: "#/components/responses/ServiceControlError" }
  /api/telemt/stop:
    post:
      tags: [telemt]
      operationId: stopTelemtService
      description: Stops only the configured Telemt service/container. Does not disable boot startup, remove containers or delete data. No automatic retry after an unconfirmed result.
      responses:
        "202": { description: Stop command completed; re-read service state to observe the result. }
        "409": { $ref: "#/components/responses/ServiceControlError" }
        "502": { $ref: "#/components/responses/ServiceControlError" }
        "503": { $ref: "#/components/responses/ServiceControlError" }
  /api/telemt/restart:
    post:
      tags: [telemt]
      operationId: restartTelemtService
      description: >
        Service-level restart through the host layer (01-host-matrix.md), independent of
        the reload endpoints above — restarts the whole process rather than re-reading
        config. Disabled when host cap restart_telemt=false.
      responses:
        "202": { description: Restart initiated }
        "409": { description: update_locked — another service or update operation is running, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: manual_restart_required — automatic restart unavailable on this host; message carries the manual command (same info as /api/host manual_commands), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: internal_error — the restart op itself failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/zero:
    get:
      tags: [telemt]
      operationId: getTelemtZero
      description: >
        Passthrough of Telemt's GET /v1/stats/zero/all — the deep counter dump
        (core/upstream/middle_proxy/pool/desync). Display-only: the panel never
        branches on these values, only shows them (web's Диагностика → Счётчики page).
        Fetched on visit, not a hub topic.
      responses:
        "200": { description: Deep counter dump, content: { application/json: { schema: { $ref: "#/components/schemas/ZeroAllData" } } } }
        "501": { description: capability_absent — this Telemt build/config does not expose zero/all, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }

  /api/telemt/tls-fingerprints:
    get:
      tags: [telemt]
      operationId: getTelemtTlsFingerprints
      description: >
        Passthrough of Telemt's GET /v1/runtime/tls-fingerprints — JA3/JA4 aggregates
        grouped by fingerprint, IP, CIDR and user. Deliberately NOT part of the `security`
        SSE topic: the live payload is ~120 KB per call (four lists of 50), so it is
        fetched on visit at the page's own cadence instead of polled for every client.
        Gated behind Telemt's runtime_edge_enabled — a build/config with it off answers
        503 capability_unavailable, which the UI renders as its Gated hint, not an error.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200": { description: Gated TLS fingerprint aggregates, content: { application/json: { schema: { $ref: "#/components/schemas/GatedTlsFingerprints" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { description: capability_absent — this Telemt build predates the runtime edge routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — runtime_edge_enabled is off, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web-access:
    get:
      tags: [telemt, users]
      operationId: getTelemtWebAccess
      description: User-oriented projection of WEB vhosts and access profiles, backed directly by Telemt Config API data.
      responses:
        "200": { description: WEB access relationships and source config revision, content: { application/json: { schema: { $ref: "#/components/schemas/WebAccessView" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — Config API is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web-access/users/{username}:
    put:
      tags: [telemt, users]
      operationId: putTelemtUserWebAccess
      description: Replaces one user's WEB profile relationships while preserving every unrelated vhost and profile. Applied with an instant runtime reload.
      parameters:
        - { $ref: "#/components/parameters/Username" }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WebUserAccessUpdate" } } }
      responses:
        "200": { description: Configuration updated, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigPatchResult" } } } }
        "202": { description: Configuration updated and reload accepted, content: { application/json: { schema: { $ref: "#/components/schemas/TelemtConfigPatchResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: web_vhost_not_found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: revision_conflict or web_profile_required, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — Config API is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web/sessions:
    get:
      tags: [telemt]
      operationId: getTelemtWebSessions
      description: >
        Passthrough of Telemt's GET /v1/runtime/web/sessions (Telemt >= 3.5.3): the live
        WEB sessions, filtered and cursor-paged. Fetch-on-visit, not part of the `web` SSE
        topic — the topic carries only the status snapshot. The query parameters below are
        the EXACT whitelist Telemt accepts; any other or repeated name is 400 bad_request.
        A WEB runtime that is not running answers 503 capability_unavailable (a gate the UI
        renders, not an error); a build predating the routes answers 501 capability_absent.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: session_ref, in: query, required: false, schema: { type: string } }
        - { name: ip, in: query, required: false, schema: { type: string } }
        - { name: host, in: query, required: false, schema: { type: string } }
        - { name: user, in: query, required: false, schema: { type: string } }
        - { name: user_agent_id, in: query, required: false, schema: { type: string } }
        - { name: key_id, in: query, required: false, schema: { type: string } }
        - { name: carrier, in: query, required: false, schema: { type: string, enum: [https, https-lanes, websocket, websocket-lanes] } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [provisional, replacing, committed, superseded, healthy, closing, closed] } }
      responses:
        "200": { description: One page of live WEB sessions, content: { application/json: { schema: { $ref: "#/components/schemas/WebSessionPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { description: capability_absent — this Telemt build predates the WEB runtime routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — the WEB runtime is not running, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web/sessions/{ref}:
    get:
      tags: [telemt]
      operationId: getTelemtWebSession
      description: >
        Passthrough of Telemt's GET /v1/runtime/web/sessions/{session_ref}. Both outcomes
        are 200: `row` for a live session, `closed` for a retained tombstone (Telemt answers
        that with HTTP 410 wrapping an ordinary success envelope, which is a result, not a
        failure). A ref with neither answers 404 web_session_not_found.
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string }, description: "Canonical ws1.<instance>.<id> reference" }
      responses:
        "200": { description: The live row or the closed-session tombstone, content: { application/json: { schema: { $ref: "#/components/schemas/WebSessionLookup" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: web_session_not_found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent — this Telemt build predates the WEB runtime routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable, or web_snapshot_busy when an exact lookup lost a lock race, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web/sessions/close:
    post:
      tags: [telemt]
      operationId: closeTelemtWebSessions
      description: >
        Passthrough of Telemt's POST /v1/runtime/web/sessions/close — the panel's ONE WEB
        mutation. Asynchronous: the 202 carries an `operation_id` to poll through
        /api/telemt/web/operations/{id}. `runtime_instance` is the process fence and comes
        from the `web` topic's status snapshot; a Telemt that has restarted since answers
        409 web_runtime_mismatch. The `all` selector additionally requires WEB issuance to
        be off (409 web_issuance_enabled). Recorded in the audit journal as
        `web.sessions.close`. Telemt's debug/clear and carrier-learning/reset mutations are
        deliberately NOT exposed by the panel.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WebCloseRequest" } } }
      responses:
        "202": { description: Close operation accepted, content: { application/json: { schema: { $ref: "#/components/schemas/WebControlOperationStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: read_only — the Telemt API runs in read-only mode, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: web_runtime_mismatch, web_issuance_enabled or web_operation_in_progress, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: payload_too_large — the close body exceeds Telemt's own 64 KiB control-body cap, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: "unsupported_media_type — Telemt's control routes require exactly one byte-exact `Content-Type: application/json`. Unreachable through the panel (the SDK sets the header itself) but declared because the code is Telemt's own.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent — this Telemt build predates the WEB runtime routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — the WEB runtime is not running, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/telemt/web/operations/{id}:
    get:
      tags: [telemt]
      operationId: getTelemtWebOperation
      description: >
        Passthrough of Telemt's GET /v1/runtime/web/operations/{operation_id}: the status of
        one close operation. Telemt retains the last 32; an older id answers 404
        web_operation_not_found.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Canonical wo1.<instance>.<sequence> id" }
      responses:
        "200": { description: Operation status, content: { application/json: { schema: { $ref: "#/components/schemas/WebControlOperationStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: web_operation_not_found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: capability_absent — this Telemt build predates the WEB runtime routes, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/TelemtUnreachable" }
        "503": { description: capability_unavailable — the WEB runtime is not running, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

