        content: { application/json: { schema: { $ref: "#/components/schemas/StoragePurgeRequest" } } }
      responses:
        "504": { $ref: "#/components/responses/HistoryTimeout" }
        "204": { description: History deleted }
        "400": { $ref: "#/components/responses/BadRequest" }

