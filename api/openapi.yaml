  /api/updates:
    get:
      tags: [updates]
      operationId: getUpdates
      responses:
        "200":
          description: Both targets — versions, releases, active run, journal
          content: { application/json: { schema: { $ref: "#/components/schemas/UpdatesStatus" } } }

  /api/updates/{target}/apply:
    post:
      tags: [updates]
      operationId: applyUpdate
      description: Install an explicitly selected release. Panel targets accept only the 1.x line; legacy and other major versions are rejected before starting an operation.
      parameters:
        - { name: target, in: path, required: true, schema: { type: string, enum: [telemt, panel] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: string } } }
      responses:
        "202": { description: Run started (progress via SSE topic `update`) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: update_locked — another update run holds the global lock, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/updates/auto:
    get:
      tags: [updates]
      operationId: getAutoUpdate
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/AutoUpdateSettings" } } } }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [updates]
      operationId: putAutoUpdate
      description: Persisted to the store — the panel never rewrites its config file.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutoUpdateSettings" } } }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/settings/storage:
    get:
      tags: [misc]
      operationId: getStorageSettings
      description: Returns optional history policies and the active store footprint. Mandatory panel state is not configurable here.
      responses:
        "504": { $ref: "#/components/responses/HistoryTimeout" }
        "200": { description: Storage settings, content: { application/json: { schema: { $ref: "#/components/schemas/StorageSettings" } } } }
    put:
      tags: [misc]
      operationId: putStorageSettings
      description: Replaces the complete optional-history policy set. Reducing retention or a per-user IP history cap (including unlimited to finite) requires confirm_retention_reduction. Omitted/null max_ips_per_user preserves the existing value. Disabling a category stops future writes but does not delete retained data or disable live RAM graphs. Existing mixed policies remain unchanged until explicitly saved.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StorageSettingsUpdate" } } }
      responses:
        "504": { $ref: "#/components/responses/HistoryTimeout" }
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/settings/storage/purge:
    post:
