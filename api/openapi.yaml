          pattern: ^(default|n_[0-9a-f]{32})$
    head:
      tags:
        - nodes
      operationId: managedProbeLogStream
      description: >-
        Node-scoped management. Uses only the selected node client, history, jobs and SSE. Legacy default
        history stays with default. Checks authentication, log capability and current capacity without opening a
        source or reserving a slot. GET atomically checks capacity again.
      parameters:
        - name: service
          in: query
          required: true
          schema:
            type: string
            enum:
              - telemt
              - panel
      responses:
        '204':
          description: A log stream can currently be attempted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Host or request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: logs_stream_limit — at most 4 process streams and 2 per session; anonymous shares one key
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 5
              description: Retry no earlier than this many seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: log_stream_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - nodes
      operationId: managedStreamLogs
      description: >-
        Node-scoped management. Uses only the selected node client, history, jobs and SSE. Legacy default
        history stays with default. SSE stream of LogLine events (`event: log`) and quiet-period heartbeats.
        File sources first emit `event: log_reset` with {"source":"file"}, replacing the viewer snapshot before
        up to 200 recent complete lines from the last 256 KiB and subsequent live entries. Paused viewers apply
        the replacement when resumed. Source startup/runtime failures are `event: log_source_error` with a
        LogSourceDiagnostic payload after HTTP 200; normal source EOF is `event: log_end`. Authentication,
        validation and capability errors remain HTTP errors before streaming begins.
      parameters:
        - name: service
          in: query
          required: true
          schema:
            type: string
            enum:
              - telemt
              - panel
      responses:
        '200':
          description: SSE of log_reset, log, heartbeat, log_source_error and log_end events
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: logs_stream_limit — capacity exhausted before streaming starts
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 5
              description: Retry no earlier than this many seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: log_stream_unavailable — host cap log_stream=false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Node missing, disabled, retired or its credentials/storage unavailable. No fallback to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
