    parameters:
      - { name: install_id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{32}$' } }
    post:
      tags: [nodes]
      operationId: applyNodeInstall
      description: Start the approved installation. A repeat for the same plan returns status without a second installation.
      responses:
        '202':
          description: Accepted for asynchronous installation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeInstallJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NodeInstallError' }
        '404': { $ref: '#/components/responses/NodeInstallError' }
        '409': { $ref: '#/components/responses/NodeInstallError' }
        '503': { $ref: '#/components/responses/NodeInstallError' }
