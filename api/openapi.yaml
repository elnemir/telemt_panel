    parameters:
      - { name: install_id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{32}$' } }
    get:
      tags: [nodes]
      operationId: getNodeInstall
      description: Retrieve the installing administrator's job status. Process-local job records expire.
      responses:
        '200':
          description: Current installation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeInstallJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NodeInstallError' }
        '404': { $ref: '#/components/responses/NodeInstallError' }
