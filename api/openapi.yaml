        Node-scoped management. Uses only the selected node client, history, jobs and SSE. Legacy default
        history stays with default. Panel operation journal (logins, user changes, config patches, updates),
        newest first, read from the store's audit ring (at most 500 entries retained).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: before
          in: query
          description: >
            Cursor for paging further back: an entry's own `ts` value from a previous response (RFC3339Nano —
            the exact format encoding/json produces for a Go time.Time). Returns entries strictly older than
            this timestamp. There is no separate opaque cursor token; `ts` doubles as one.
          schema:
            type: string
            format: date-time
      responses:
